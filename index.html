<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모의고사">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>모의고사 기록장</title>
<style>
:root{
  color-scheme:light;
  --paper:#f5f6f8; --card:#ffffff; --ink:#1c2130; --sub:#6a7080; --line:#e3e5ea;
  --field:#eff1f4; --omr:#c92a5b; --omr-weak:#fce8ef; --danger:#c92a2a;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --paper:#101218; --card:#191c24; --ink:#eceef3; --sub:#9aa0ae; --line:#2a2e38;
    --field:#22262f; --omr:#f06595; --omr-weak:#3a1e2a; --danger:#ff6b6b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.5;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}

/* 상단·하단 */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px;background:var(--paper)}
.top h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.03em}
#savestate{font-size:12px;color:var(--sub);white-space:nowrap;padding-bottom:3px}
#savestate.err{color:var(--danger)}
main{max-width:640px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:11px;
  padding:8px 0 6px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs svg,.side svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:700}

/* 공통 */
.card{background:var(--card);border-radius:18px;padding:18px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1.5px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input,textarea{-webkit-appearance:none;appearance:none}
input[type=date]{min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:76px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
.field{margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-size:15px;font-weight:700;
  background:var(--ink);color:var(--card);width:100%}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.back{border:0;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:6px 0}
.notice{border:1.5px dashed var(--omr);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;margin:8px 0}

/* OMR 등급 표기: 이 앱의 핵심 시각 요소 */
.omr{display:grid;grid-template-columns:76px minmax(0,300px) 34px;justify-content:start;gap:10px;align-items:center;padding:7px 0}
.omr + .omr{border-top:1px solid var(--line)}
.omr .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.omr .gr{font-size:20px;font-weight:800;text-align:right}
.bubbles{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.bubbles i{height:24px;border:1.5px solid var(--omr);border-radius:999px;color:var(--omr);
  font-style:normal;font-size:10px;font-weight:600;display:grid;place-items:center}
.bubbles i.goal{background:var(--omr-weak);border-width:2px}
.bubbles i.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:9px;height:13px;border-radius:9px;margin-right:5px;vertical-align:-2px}
.legend .l1::before{background:var(--ink)}
.legend .l2::before{background:var(--omr-weak);border:2px solid var(--omr)}

/* 시험 목록 */
.exam{display:flex;gap:12px;align-items:center;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;
  border:1.5px solid var(--omr);color:var(--omr)}
.tag.plain{border-color:var(--line);color:var(--sub)}
.gline{font-size:13px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.gline b{color:var(--ink);font-weight:700}
.chev{color:var(--sub);font-size:22px}

/* 상세 */
.subj{padding:12px 0}
.subj + .subj{border-top:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.grid4 input,.grid2 input{text-align:center;padding:10px 4px}
.wform{display:grid;grid-template-columns:1fr 84px;gap:6px;margin-bottom:6px}
.wrong{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.wrong .no{font-weight:800;min-width:42px}
.x{border:0;background:none;color:var(--sub);font-size:20px;padding:2px 8px;line-height:1}

/* 통계 막대 */
.barrow{display:grid;grid-template-columns:78px 1fr 26px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bar{height:10px;border-radius:5px;background:var(--omr)}
.bar.ink{background:var(--ink)}
.chartbox{position:relative;height:270px}

/* 로그인 */
.center{min-height:100vh;display:grid;place-items:center;color:var(--sub);padding:24px;text-align:center}
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 64px) 24px 40px}
.login h1{font-size:28px;letter-spacing:-.03em;margin:16px 0 4px}
.login .bubbles{max-width:240px}
#loginMsg{font-size:14px;min-height:21px;margin:10px 0;color:var(--danger)}
#loginMsg.ok{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;padding:8px 0;margin-top:6px}
/* 공식/사설 구분 탭, 필터 */
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;margin:8px 0 8px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--sub);padding:9px 6px;border-radius:9px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{font-size:12px;font-weight:500;color:var(--sub);margin-left:5px}
.chipsrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chipsrow.wrap{flex-wrap:wrap;overflow:visible}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;min-height:36px}
.fchip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.missing{color:var(--omr);font-weight:700}
input.req:placeholder-shown{border-color:var(--omr)}
input::placeholder{color:var(--sub);opacity:.7}
.ratebox{display:grid;place-items:center;height:46px;border-radius:10px;border:1.5px dashed var(--line);font-weight:800;font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid3 input{text-align:center;padding:10px 4px}
.hint{font-size:12px;color:var(--sub);margin:-4px 0 6px}

.pmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px 6px}
.pmeta .full{grid-column:1/-1}
@container (min-width:560px){ .pmeta{grid-template-columns:2fr .8fr 1fr 1.3fr} .pmeta .full{grid-column:auto} }
.pmeta .span{grid-column:1/-1}
.roundbox{position:relative}
.roundbox input{padding-right:30px;text-align:center}
.roundbox span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.newser{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.serrow{padding:10px 0;border-top:1px solid var(--line)}
.serrow:first-of-type{border-top:0}
.serrow .row{gap:6px}
.serrow.hidden input{opacity:.5}
.chipsrow.sm .fchip{padding:4px 10px;font-size:12px;min-height:30px}

/* 한눈에 카드 편집 */
.homebar{display:flex;justify-content:flex-end;margin:2px 0 -4px}
.erow{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.erow.off .grow{opacity:.45}
.etools{display:flex;gap:6px;align-items:center;flex:none}
.ibtn{min-width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:700;padding:0}
.ibtn.wide{font-size:13px;padding:0 10px}
.ibtn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ibtn:disabled{opacity:.3}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--ink)}
.sw.on i{left:23px;background:var(--card)}
@media (prefers-reduced-motion:no-preference){ .sw i{transition:left .15s} }
.dday .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:12px 0 6px}
@media (min-width:1024px) and (min-height:560px){
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;grid-auto-flow:row dense;align-items:start}
  .hgrid .w2{grid-column:1/-1}
}

/* 타이머 */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tsub{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.tsub b{font-size:15px}
.tsub span{font-size:12px;color:var(--sub)}
.tsub.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tsub.on span{color:var(--card);opacity:.8}
.tsub:disabled{opacity:.45}
.tsub.on:disabled{opacity:1}
.btn:disabled{opacity:.45;cursor:default}
.tcard{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--field);stroke-width:10}
.ring .bar2{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round}
.ring.low .bar2{stroke:var(--omr)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tm-time{font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1}
.ring.low #tm-time{color:var(--omr)}
#tm-sub{font-size:14px;color:var(--sub)}
.tbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px;width:100%;max-width:360px}
#tm-msg{min-height:24px;margin:10px 0 0;font-weight:700;color:var(--omr)}
.tabs button.run,.side nav button.run{position:relative}
.tabs button.run::after{content:"";position:absolute;top:7px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--omr)}
.side nav button.run::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--omr);margin-left:auto}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--card);
  padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;z-index:50;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){ #toast{transition:transform .25s} .ring .bar2{transition:stroke-dashoffset .25s linear} }
/* 풀이 시간 측정 */
.swrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:6px;align-items:center;padding:10px 0}
.swrow + .swrow{border-top:1px solid var(--line)}
.swclock{font-size:22px;font-weight:800;min-width:76px;text-align:right}
.swrow.running .swclock{color:var(--omr)}
.swbtn{min-width:64px}
@media (min-width:700px) and (min-height:560px){ .tgrid{grid-template-columns:repeat(4,1fr)} .ring{width:320px} }

/* 전체화면 */
html.fs-on, html.fs-on body{overflow:hidden}
.fs{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px))}
.fs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fs-t1{font-size:20px;font-weight:800;line-height:1.3}
.fs-t2{font-size:14px;color:var(--sub)}
.fs-close{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:10px 16px;flex:none}
.fs-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;text-align:center}
.fs-label{font-size:clamp(15px,2.6vw,24px);font-weight:700;color:var(--sub)}
.fs-time{font-size:min(23vw,38vh);font-weight:800;letter-spacing:-.03em;line-height:1}
.fs-time.long{font-size:min(17vw,30vh)}
.fs.over .fs-time,.fs.over .fs-label,.fs.low .fs-time{color:var(--omr)}
.fs-sub{font-size:clamp(14px,2.2vw,20px);color:var(--sub);min-height:1.5em}
.fs-prog{width:min(560px,82%);height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:14px}
.fs-prog i{display:block;height:100%;background:var(--ink);width:0}
.fs.over .fs-prog i,.fs.low .fs-prog i{background:var(--omr)}
.fs-bot{display:flex;flex-direction:column;align-items:center;gap:14px}
.fs-target{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.fs-tgv{border:0;background:var(--field);color:var(--ink);font:inherit;font-size:17px;font-weight:800;border-radius:10px;min-width:88px;height:40px}
.fs-main{max-width:420px;padding:18px;font-size:18px}
@media (orientation:landscape) and (max-height:520px){ .fs-bot{flex-direction:row;justify-content:center} .fs-main{width:auto;min-width:220px;padding:14px} .fs-prog{margin-top:6px} }
.swfs{width:40px;height:40px}
.swfs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* 문항별 랩 */
.fs-lap{font-size:clamp(15px,2.4vw,22px);font-weight:700;min-height:1.5em;margin-top:6px}
.fs-btns{display:grid;grid-template-columns:2fr 1fr;gap:10px;width:100%;max-width:520px}
.fs-btns .fs-main{max-width:none}
.fs-undo{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;padding:4px}
.laps{margin-top:6px}
.laprow{display:grid;grid-template-columns:52px minmax(0,1fr) 52px auto 32px;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.laprow .lno{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;padding:4px 0}
.laprow .lt{text-align:right;font-weight:700}
.laprow.max .lt{color:var(--omr)}
.laprow.max .bar{background:var(--omr)}
.laprow .bar{background:var(--ink)}
.lapw{border:1.5px solid var(--omr);background:none;color:var(--omr);font:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:5px 8px;white-space:nowrap}
.lapw:disabled{border-color:var(--line);color:var(--sub)}
.lapsum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:4px 0 2px}
.lapsum b{color:var(--ink)}

/* 오답 노트 */
.sheet{position:fixed;inset:0;z-index:45;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(16px,env(safe-area-inset-left,0px))}
.sheet .sh-in{max-width:720px;margin:0 auto}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:calc(-14px - env(safe-area-inset-top,0px));background:var(--paper);padding:4px 0 8px;z-index:2}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.shot{position:relative;margin:0;border-radius:12px;overflow:hidden;background:var(--field)}
.shot img{display:block;width:100%;height:140px;object-fit:contain;background:#fff;cursor:zoom-in}
.shot.prob{grid-column:1/-1}
.shot.prob img{height:auto;max-height:340px}
.shot.big{grid-column:1/-1}
.shot.big img{height:auto;max-height:none;cursor:zoom-out}
.shot figcaption{font-size:12px;font-weight:700;padding:5px 8px;color:var(--sub)}
.shot .x{position:absolute;top:4px;right:4px;background:var(--card);border-radius:50%;width:30px;height:30px;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cropwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;border-radius:12px;background:#111;margin:6px 0 10px}
#cropCv{display:block;margin:0 auto}
.cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);touch-action:none;cursor:move}
.cropbox i{position:absolute;width:36px;height:36px;margin:-18px;display:grid;place-items:center}
.cropbox i::after{content:"";width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.cropbox i[data-h=nw]{left:0;top:0;cursor:nwse-resize} .cropbox i[data-h=ne]{right:0;top:0;cursor:nesw-resize}
.cropbox i[data-h=sw]{left:0;bottom:0;cursor:nesw-resize} .cropbox i[data-h=se]{right:0;bottom:0;cursor:nwse-resize}
.wopen{flex:1;min-width:0;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer}
.wbadge{font-size:12px;color:var(--omr);font-weight:700;margin-top:2px}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--field);flex:none}
.thumb.ph{display:grid;place-items:center;font-size:10px;color:var(--sub);text-align:center;line-height:1.2;padding:2px}
.wbitem{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;padding:10px 0;cursor:pointer}
.wbitem .grow{display:flex;flex-direction:column;gap:2px}
.wbitem .d{font-size:12px}
.snip{font-size:13px;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

let saveTimer = null;
function setSave(t, err=false){ const el = $('#savestate'); el.textContent = t; el.classList.toggle('err', err); }
function touch(){ setSave('저장 대기…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!data) return;
  const payload = JSON.parse(JSON.stringify(data));
  if (mode === 'local'){
    try { localStorage.setItem(LS_KEY, JSON.stringify(payload)); setSave('이 기기에 저장됨'); }
    catch (err) { console.error(err); setSave('저장 실패: 저장 공간 확인', true); }
    return;
  }
  // Firestore는 쓰기를 기기에 먼저 보관하고, 연결되면 서버로 올림
  pendingWrites++;
  setSave(navigator.onLine ? '저장 중…' : '오프라인: 기기에 보관 중');
  fb.F.setDoc(fb.F.doc(fb.db, 'users', user.uid), payload)
    .then(() => { pendingWrites = Math.max(0, pendingWrites - 1); if (!pendingWrites) setSave('저장됨'); })
    .catch(err => {
      pendingWrites = Math.max(0, pendingWrites - 1); console.error(err);
      setSave(err?.code === 'permission-denied' ? '저장 거부됨: 보안 규칙 확인' : '저장 실패, 10초 뒤 다시 시도', true);
      if (err?.code !== 'permission-denied') saveTimer = setTimeout(flush, 10000);
    });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flush(); });

async function loadData(){
  if (mode === 'local'){
    let raw = null; try { raw = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
    data = normalize(raw);
    if (!raw) flush();
    return;
  }
  const ref = fb.F.doc(fb.db, 'users', user.uid);
  let snap;
  try { snap = await fb.F.getDoc(ref); }
  catch (err) { if (err?.code === 'unavailable') snap = await fb.F.getDocFromCache(ref); else throw err; }
  data = normalize(snap.exists() ? snap.data() : null);
  if (!snap.exists()) await flush();
}

function bubbleRow(name, g, goal){
  let b = '';
  for (let n = 1; n <= 9; n++) b += `<i class="${n===g?'on':''} ${n===goal?'goal':''}">${n}</i>`;
  return `<div class="omr"><span class="nm">${esc(name)}</span><span class="bubbles" aria-hidden="true">${b}</span>
    <span class="gr" aria-label="${esc(name)} ${g ?? '미입력'}등급">${g ?? '–'}</span></div>`;
}
function barRow(label, n, max, ink){
  return `<div class="barrow"><span>${esc(label)}</span><div><div class="bar ${ink?'ink':''}" style="width:${Math.max(6, n/max*100)}%"></div></div><b style="text-align:right">${n}</b></div>`;
}

const CARD_INFO = {
  omr:['최근 공식 시험 등급','가장 최근 공식 시험의 과목별 등급과 목표'],
  dday:['수능 D-day','수능과 다음 공식 시험까지 남은 날'],
  next:['다음 기록할 시험','아직 성적을 넣지 않은 공식 시험'],
  trend:['성적 추이','대상과 과목은 카드에서 바꿔요'],
  reasons:['오답 원인','모든 시험의 틀린 이유 통계'],
  subjWrongs:['과목별 오답 수','과목마다 틀린 문항 수'],
  offTable:['공식 시험 성적표','회차별 등급과 백분위 표'],
  privTable:['사설·하프 기록 표','사설·하프 점수를 최근 순으로'],
  wrongBook:['오답 노트','사진·텍스트를 붙인 오답을 검색하고 모아 봐요'],
};
const FIXED_CARDS = ['omr','dday','next','reasons','subjWrongs','wrongBook','offTable','privTable'];
const devKey = () => isWide() ? 'tablet' : 'phone';
const newTrend = target => ({id:newId(), type:'trend', size:'n', hidden:false, cfg:{target, metric:'grade', subj:'ma'}});
function defaultLayout(dev){
  const c = (type, size='n', hidden=false) => ({id:type, type, size, hidden});
  return dev === 'tablet'
    ? [c('omr'), newTrend('official'), c('dday'), c('next'), newTrend('priv:all'), c('reasons'), c('subjWrongs'), c('wrongBook','w'), c('offTable','w'), c('privTable','w')]
    : [c('omr'), c('dday'), c('next'), newTrend('official'), newTrend('priv:all'), c('reasons'), c('subjWrongs'), c('wrongBook','w'), c('offTable','w',true), c('privTable','w',true)];
}
function normLayout(arr){
  if (!Array.isArray(arr)) return null;
  const out = [], seen = new Set();
  for (const it of arr){
    if (!it || !CARD_INFO[it.type]) continue;
    if (it.type !== 'trend'){ if (seen.has(it.type)) continue; seen.add(it.type); }
    const o = {id: it.type === 'trend' ? (it.id || newId()) : it.type, type:it.type, size: it.size === 'w' ? 'w' : 'n', hidden:!!it.hidden};
    if (it.type === 'trend') o.cfg = {target:it.cfg?.target || 'official', metric:it.cfg?.metric || 'grade', subj:it.cfg?.subj || 'ma'};
    out.push(o);
  }
  for (const t of FIXED_CARDS) if (!seen.has(t)) out.push({id:t, type:t, size: t.endsWith('Table') ? 'w' : 'n', hidden:false});
  return out;
}
function layout(){
  const L = (data.settings.layout ??= {phone:null, tablet:null}), k = devKey();
  if (!L[k]) L[k] = defaultLayout(k);
  return L[k];
}

// ── 추이 카드 (여러 개 가능) ──
function trendTargets(){
  const o = [['official','공식 시험'],['priv:all','사설·하프 전체'],['priv:사설','사설 전체'],['priv:하프','하프 전체']];
  data.settings.series.filter(x => !x.hidden || data.exams.some(e => e.seriesId === x.id)).forEach(x => o.push([x.id, serLabel(x)]));
  return o;
}
function trendTitle(cfg){
  const t = cfg.target;
  if (t === 'official') return '공식 시험 추이';
  if (t === 'priv:all') return '사설·하프 추이';
  if (t === 'priv:사설') return '사설 추이';
  if (t === 'priv:하프') return '하프 추이';

  return sr ? `${sr.name} 추이` : '성적 추이';
}
function trendData(cfg){
  if (cfg.target === 'official') return sortedExams().filter(isOfficial).filter(hasScore);

  return sortedExams().filter(e => !isOfficial(e)
    && (t === 'priv:all' || (t === 'priv:사설' && e.type === '사설') || (t === 'priv:하프' && e.type === '하프') || e.seriesId === t)

}
function trendCard(it){
  const cfg = it.cfg, subs = subjects(), targets = trendTargets();
  if (!targets.some(([v]) => v === cfg.target)) cfg.target = 'priv:all';
  if (!subs.find(s => s.key === cfg.subj)) cfg.subj = subs[0].key;
  const off = cfg.target === 'official', list = trendData(cfg);

    if (hasH) ds.push({ label:'하프 정답률(%)', yAxisID:'y1', data: list.map(e => isHalf(e) ? rateOf(e.scores[k]) : null),
      borderColor:COLORS[1], backgroundColor:COLORS[1], borderDash:[6,4], spanGaps:true, tension:.25, pointRadius:4, pointStyle:'rectRot', borderWidth:2 });
    const lab = e => single && e.round != null ? `${e.round}회` : (e.date ? `${+e.date.slice(5,7)}/${+e.date.slice(8,10)}` : (e.round != null ? `${e.round}회` : '–'));
    config = { type:'line', data:{ labels: list.map(lab), datasets: ds },
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        plugins:{ legend, tooltip:{ callbacks:{
          title: items => { const e = list[items[0].dataIndex]; return `${examName(e)}${e.date ? ` (${fmtDate(e.date)})` : ''}`; },
          label: x => { const e = list[x.dataIndex], sc = e.scores[k]; return isHalf(e) ? `하프 ${sc.correct}/${sc.total ?? '?'} (${rateOf(sc) ?? '?'}%)` : `사설 원점수 ${sc.raw}점`; } } } },
        scales:{ x:{ ticks:{color:sub, maxRotation:0, autoSkip:true}, grid:{display:false} },
          y:{ display:hasP, position:'left', ticks:{color:sub}, grid:{color:line}, title:{display:true, text:'원점수', color:sub} },
          y1:{ display:hasH, position:'right', min:0, max:100, ticks:{color:sub}, grid:{drawOnChartArea:!hasP, color:line}, title:{display:true, text:'정답률 %', color:sub} } } } };
  }
  charts.push(new Chart(c, config));
}

function catExams(){
  const list = sortedExams().filter(e => catOf(e) === state.cat && (state.cat === 'official' || !state.ser || e.seriesId === state.ser));
  if (state.cat === 'official') return list;
  return list.sort((a,b) => (b.date || '').localeCompare(a.date || '') || (b.round ?? 0) - (a.round ?? 0));

function examsHeader(){
  const nOff = data.exams.filter(isOfficial).length, nPriv = data.exams.length - nOff;
  let h = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${state.cat==='official'}" class="${state.cat==='official'?'on':''}" data-act="cat" data-cat="official">공식 시험<span class="n">${nOff}</span></button>
    <button role="tab" aria-selected="${state.cat==='private'}" class="${state.cat==='private'?'on':''}" data-act="cat" data-cat="private">사설·하프<span class="n">${nPriv}</span></button></div>`;
  if (state.cat === 'private'){
    const sers = usedSeries(); if (state.ser && !sers.some(x => x.id === state.ser)) state.ser = '';
    if (sers.length) h += `<div class="chipsrow" aria-label="시험 이름"><button class="fchip ${!state.ser?'on':''}" data-act="ser" data-id="">전체</button>${sers.map(x => `<button class="fchip ${state.ser===x.id?'on':''}" data-act="ser" data-id="${x.id}">${esc(serLabel(x))}</button>`).join('')}</div>`;
    h += `<div class="grid2" style="margin:2px 0 4px"><button class="btn ghost" data-act="add-exam" data-type="사설">사설 추가</button><button class="btn ghost" data-act="add-exam" data-type="하프">하프 추가</button></div>`;
  } else h += `<button class="btn ghost" data-act="add-exam" data-type="교육청" style="margin:2px 0 4px">공식 시험 추가</button>`;
  return h;
}
function examItem(e, inSplit){
  const off = isOfficial(e), subs = examSubs(e), filled = hasScore(e), nW = (e.wrongs || []).length;
  const active = inSplit && e.id === state.examId, miss = missingOf(e);
  const when = e.date ? fmtDate(e.date) : (e.month ? `${e.month}월, 날짜 미정` : '날짜 미정');
  let line;
  if (off) line = filled ? subs.map(s => `<span>${esc(s.name)} <b>${e.scores?.[s.key]?.grade ?? '–'}</b></span>`).join('') : '<span>아직 기록 없음</span>';
  else line = subs.map(s => { const t = minText(e.scores?.[s.key]?.time); return `<span>${esc(s.name)} <b>${scoreText(e, s)}</b>${t ? ` (${t})` : ''}</span>`; }).join('') + (miss ? `<span class="missing">${miss}</span>` : '');
  const st = off ? (filled ? `기록 완료${nW ? `, 오답 ${nW}` : ''}` : '아직 기록 없음') : (miss ? `<span class="missing">${miss}</span>` : `기록 완료${nW ? `, 오답 ${nW}` : ''}`);
  return `<section class="card exam ${active ? 'active' : ''}" data-act="open" data-id="${e.id}" ${active ? 'aria-current="true"' : ''}><div class="grow">

    <b class="ename" data-id="${e.id}" style="display:block;margin-top:4px;font-size:17px">${esc(examName(e))}</b>
    <div class="gline">${line}${nW ? `<span>오답 <b>${nW}</b></span>` : ''}</div>
    ${inSplit ? `<div class="st">${st}</div>` : ''}</div>${inSplit ? '' : '<span class="chev">›</span>'}</section>`;
}
const emptyCat = () => `<section class="card"><p class="sub" style="margin:0">${state.cat === 'private'
  ? (state.ser ? '이 이름으로 기록한 시험이 없어요.' : '사설·하프 시험이 아직 없어요. 위 버튼으로 추가해 보세요.') : '공식 시험이 없어요. 위 버튼으로 추가해 보세요.'}</p></section>`;
function renderExams(){
  const list = catExams();

function renderSplit(){
  const list = catExams();

  if (!e || !list.includes(e)){

const wake = {
  lock:null, video:null, want:false,
  async on(){
    this.want = true;
    if (this.lock) return;
    try {
      if ('wakeLock' in navigator){
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => { this.lock = null; });
        return;
      }
    } catch {}
    // Wake Lock을 못 쓰는 기기: 소리 없는 영상을 반복 재생해 화면 꺼짐을 막음
    if (!this.video){
      const v = document.createElement('video');
      Object.assign(v, {muted:true, loop:true, playsInline:true, src:NOSLEEP_MP4});
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;left:0';
      document.body.appendChild(v); this.video = v;
    }
    this.video.play().catch(() => {});
  },
  off(){
    this.want = false;
    this.lock?.release().catch(() => {}); this.lock = null;
    this.video?.pause();
  },
};
function syncWake(){ (timer.running || sw.examId) ? wake.on() : wake.off(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wake.want) { wake.lock = null; wake.on(); } });

let actx = null;
function ensureSound(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}

}
function beep(pattern){
  if (!actx) return;
  let t = actx.currentTime + 0.05;
  for (const [f, d, gap] of pattern){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.05); t += d + gap;
  }
}
const BEEP_WARN = [[880,.18,.12],[880,.18,0]];
const BEEP_END = [[988,.35,.15],[784,.35,.15],[988,.35,.15],[784,.6,0]];
function toast(msg, sticky=false){

}

const idb = {
  p:null,
  open(){ return this.p ??= new Promise((res, rej) => { const r = indexedDB.open('mocklog-media', 2);
    r.onupgradeneeded = () => { const db = r.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      for (const n of ['notes','images']) if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, {keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async tx(name, mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(name, mode), q = fn(t.objectStore(name)); t.oncomplete = () => res(q?.result ?? null); t.onerror = () => rej(t.error); }); },
  get(k){ return this.tx('files', 'readonly', st => st.get(k)); },
  set(k, v){ return this.tx('files', 'readwrite', st => st.put(v, k)); },
  del(k){ return this.tx('files', 'readwrite', st => st.delete(k)); },
  getFrom(n, k){ return this.tx(n, 'readonly', st => st.get(k)); },
  put(n, v){ return this.tx(n, 'readwrite', st => st.put(v)); },

};

function audioDuration(file){

const timer = { subj:null, total:0, remain:0, endAt:0, running:false, done:false, warned:{w10:false, w5:false}, audio:false };

  stopPreview();
  Object.assign(timer, {subj:k, total:timerMinutes(k) * 60000, running:false, done:false, warned:{w10:false, w5:false}, audio: k === 'en' && !!media});
  timer.remain = timer.total;
  enAudio.pause(); try { enAudio.currentTime = 0; } catch {}
}
function clock(ms, up=false){
  const t = up ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
const clockTime = d => d.toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit'});
function timerStart(){
  if (!timer.subj) return;
  if (timer.done || timer.remain <= 0) setTimerSubj(timer.subj);
  stopPreview(); ensureSound();
  timer.endAt = Date.now() + timer.remain; timer.running = true;
  if (timer.audio && media){
    const pos = (timer.total - timer.remain) / 1000;
    if (!media.duration || pos < media.duration){
      try { enAudio.currentTime = pos; } catch {}
      enAudio.play().catch(() => toast('음원을 재생하지 못했어요. 무음 모드와 볼륨을 확인해 주세요.'));
    }

}
function timerPause(){
  if (!timer.running) return;

  enAudio.pause(); syncWake();
}
function timerFinish(){
  timer.remain = 0; timer.running = false; timer.done = true;

  const s = subjects().find(x => x.key === timer.subj);

function tickTimer(){
  if (!timer.running) return;
  timer.remain = Math.max(0, timer.endAt - Date.now());
  const min = timer.total / 60000;
  if (!timer.warned.w10 && min > 10 && timer.remain <= 600000 && timer.remain > 0){
    timer.warned.w10 = true; if (timer.remain > 300000){ beep(BEEP_WARN); toast('종료 10분 전이에요.'); } }
  if (!timer.warned.w5 && min > 5 && timer.remain <= 300000 && timer.remain > 0){ timer.warned.w5 = true; timer.warned.w10 = true; beep(BEEP_WARN); toast('종료 5분 전이에요.'); }
  if (timer.remain <= 0){ timerFinish(); return; }
  const t = $('#tm-time'); if (!t) return;
  t.textContent = clock(timer.remain);
  const bar = $('#tm-bar'); if (bar){ const C = 2 * Math.PI * 54; bar.setAttribute('stroke-dashoffset', C * (1 - timer.remain / timer.total)); }
  $('#tm-ring')?.classList.toggle('low', timer.remain <= 300000);
}

const sw = { examId:null, subj:null, startAt:0 };

const saveSw = () => { try { localStorage.setItem('mocklog-sw', JSON.stringify(sw)); } catch {} };
function swMs(e, k){
  const base = (e.scores?.[k]?.time || 0) * 1000;
  return sw.examId === e.id && sw.subj === k ? base + (Date.now() - sw.startAt) : base;
}
const lapsOf = (e, k) => e.scores?.[k]?.laps || [];
const lapSum = (e, k) => lapsOf(e, k).reduce((a, l) => a + l.ms, 0);
const nextLapNo = (e, k) => { const L = lapsOf(e, k); return L.length ? (Number(L[L.length - 1].no) || L.length) + 1 : 1; };
function lapNow(e, k){
  const ms = Math.max(0, swMs(e, k) - lapSum(e, k));
  e.scores ??= {}; const sc = (e.scores[k] ??= {}); sc.laps ??= [];
  sc.laps.push({no: nextLapNo(e, k), ms}); touch();

document.addEventListener('pointermove', ev => {
  if (!cropDrag) return;
  ev.preventDefault();
  const dx = (ev.clientX - cropDrag.x0) / cropDrag.W, dy = (ev.clientY - cropDrag.y0) / cropDrag.H, m = 0.05, h = cropDrag.h;
  let {x, y, w, h:hh} = cropDrag.r;
  if (h === 'move'){ x = clamp(x + dx, 0, 1 - w); y = clamp(y + dy, 0, 1 - hh); }
  else {
    if (h.includes('w')){ const nx = clamp(x + dx, 0, x + w - m); w += x - nx; x = nx; }
    if (h.includes('e')) w = clamp(w + dx, m, 1 - x);
    if (h.includes('n')){ const ny = clamp(y + dy, 0, y + hh - m); hh += y - ny; y = ny; }
    if (h.includes('s')) hh = clamp(hh + dy, m, 1 - y);

async function startCrop(file){

  } catch { alert('사진을 열 수 없어요. 다른 사진으로 다시 해 주세요.'); }
}
function cropCanvas(maxW, minW=0){
  const {src, rect} = state.crop;
  const sx = Math.round(rect.x * src.width), sy = Math.round(rect.y * src.height), sw2 = Math.max(1, Math.round(rect.w * src.width)), sh2 = Math.max(1, Math.round(rect.h * src.height));
  let k = Math.min(1, maxW / sw2); if (minW && sw2 * k < minW) k = Math.min(2.5, minW / sw2);
  const out = document.createElement('canvas'); out.width = Math.round(sw2 * k); out.height = Math.round(sh2 * k);
  const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height); x.drawImage(src, sx, sy, sw2, sh2, 0, 0, out.width, out.height);
  return out;
}
function compress(canvas){
  // Firestore 문서 한 개는 1MB까지라 사진을 약 700KB 이하로 줄임
  let c = canvas, q = 0.75, url = c.toDataURL('image/jpeg', q);
  while (url.length > 700000){
    if (q > 0.45){ q -= 0.1; }
    else { const d = document.createElement('canvas'); d.width = Math.round(c.width * 0.8); d.height = Math.round(c.height * 0.8); d.getContext('2d').drawImage(c, 0, 0, d.width, d.height); c = d; q = 0.7; }
    url = c.toDataURL('image/jpeg', q);
  }
  return url;
}
async function saveCrop(kind){

  const url = compress(cropCanvas(1400));
  const ocrSrc = kind === 'prob' ? cropCanvas(2400, 1600) : null;
  const n = noteOf(id), imgId = newId();
  n.imgs = [...n.imgs, {id:imgId, kind}];

let ocrWorker = null, ocrBusy = false;
function loadScript(src){ return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('불러오기 실패')); document.head.appendChild(sc); }); }
function setOcrMsg(t, busy=true){ const m = $('#ocrMsg'); if (m){ m.textContent = t; m.classList.toggle('busy', busy); } }
function cleanOcr(t){
  return t.split('\n').map(line => {
    let l = line.replace(/[ \t]+/g, ' ').trim();
    const toks = l.split(' '), single = toks.filter(x => /^[가-힣]$/.test(x)).length;
    if (toks.length > 3 && single / toks.length > 0.5) l = l.replace(/([가-힣]) (?=[가-힣])/g, '$1');
    return l;
  }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
async function runOcr(wrongId, sources){
  if (ocrBusy){ toast('글자를 읽는 중이에요. 잠시만 기다려 주세요.'); return; }
  if (!localStorage.getItem('mocklog-ocr-ready') && !confirm('처음 한 번 글자 인식 데이터(십여 MB)를 내려받아요. Wi-Fi에서 하시는 걸 권해요. 계속할까요?')) return;
  ocrBusy = true; setOcrMsg('글자 인식 준비 중…');
  try {
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('kor', 1, { logger: m => {
      if (m.status === 'loading language traineddata') setOcrMsg(`인식 데이터 내려받는 중 ${Math.round((m.progress || 0) * 100)}%`);
      else if (m.status === 'recognizing text') setOcrMsg(`글자 읽는 중 ${Math.round((m.progress || 0) * 100)}%`);
    }});
    localStorage.setItem('mocklog-ocr-ready', '1');
    const out = [];
    for (const src of sources){ const {data:r} = await ocrWorker.recognize(src); out.push(cleanOcr(r.text || '')); }
    const txt = out.filter(Boolean).join('\n\n');
    if (txt){
      const n = noteOf(wrongId); n.text = n.text.trim() ? `${n.text.trim()}\n\n${txt}` : txt; store.setNote(wrongId, n);
      if (state.wn?.wrongId === wrongId && !state.crop){ const ta = $('#wnText'); if (ta) ta.value = n.text; }
      setOcrMsg('글자를 읽었어요. 틀리게 읽힌 부분은 직접 고쳐 주세요.', false);
    } else setOcrMsg('읽을 수 있는 글자를 찾지 못했어요. 사진을 더 가까이, 반듯하게 찍어 보세요.', false);
  } catch (err) {
    console.error(err); ocrWorker = null;
    setOcrMsg(navigator.onLine ? '글자 인식에 실패했어요. 다시 시도해 주세요.' : '처음 한 번은 인터넷 연결이 필요해요.', false);
  } finally { ocrBusy = false; }
}

    if (sec == null && e.scores[k].laps?.length && confirm('문항별 기록도 함께 지울까요?')) e.scores[k].laps = [];
    touch(); syncWake(); render();
  },
  tab: t => go({tab:t.dataset.tab, examId:null, editHome:false}),
  'home-edit': () => go({editHome:true}),
  'home-done': () => go({editHome:false}),
  'lay-move': t => {
    const L = layout(), i = L.findIndex(x => x.id === t.dataset.id), j = i + Number(t.dataset.dir);
    if (i < 0 || j < 0 || j >= L.length) return;
    [L[i], L[j]] = [L[j], L[i]]; touch(); render();
    const b = document.querySelector(`[data-act="lay-move"][data-dir="${t.dataset.dir}"][data-id="${t.dataset.id}"]`);
    (b && !b.disabled ? b : document.querySelector(`[data-act="lay-move"][data-id="${t.dataset.id}"]:not([disabled])`))?.focus();
  },
  'lay-toggle': t => { const it = layout().find(x => x.id === t.dataset.id); it.hidden = !it.hidden; touch(); render(); },
  'lay-size': t => { const it = layout().find(x => x.id === t.dataset.id); it.size = it.size === 'w' ? 'n' : 'w'; touch(); render(); },
  'lay-del': t => { const L = layout(), i = L.findIndex(x => x.id === t.dataset.id); if (i >= 0) L.splice(i, 1); touch(); render(); },
  'lay-add-trend': () => { const it = newTrend('priv:all'); layout().push(it); touch(); render();
    document.querySelector(`[data-act="lay-toggle"][data-id="${it.id}"]`)?.scrollIntoView({block:'center'}); },
  'lay-reset': () => {
    if (!confirm('이 기기 종류의 카드 배치를 처음 상태로 되돌릴까요?')) return;
    data.settings.layout[devKey()] = defaultLayout(devKey()); touch(); render();
  },
  open: t => { const e = data.exams.find(x => x.id === t.dataset.id); state.reveal = true; go({tab:'exams', examId:t.dataset.id, cat: e ? catOf(e) : state.cat}); },
  cat: t => go({tab:'exams', cat:t.dataset.cat, examId:null}),
  ser: t => go({ser:t.dataset.id, examId:null}),
  'add-series': () => {
    const e = cur(), name = $('#newSerName')?.value || '';
    if (!name.trim()){ $('#newSerName')?.focus(); return; }
    const sr = addSeries(name, e.type, e.subjs);
    const keepSubjs = e.subjs && e.subjs.length ? [...e.subjs] : null;
    applySeries(e, sr); if (keepSubjs){ e.subjs = keepSubjs; sr.subjs = [...keepSubjs]; }
    state.newSer = false; touch(); render();
  },
  'cancel-series': () => { state.newSer = false; render(); },
  'set-add-series': () => { const v = $('#setNewSer').value; if (!v.trim()) return; addSeries(v, $('#setNewSerType').value, []); touch(); render(); },
  'ser-hide': t => { const sr = data.settings.series.find(x => x.id === t.dataset.id); sr.hidden = !sr.hidden; touch(); render(); },
  'ser-del': t => {
    const sr = data.settings.series.find(x => x.id === t.dataset.id);
    if (!confirm(`"${sr.name}"을(를) 목록에서 지울까요?`)) return;
    data.settings.series = data.settings.series.filter(x => x !== sr); touch(); render();
  },
  'ser-subj': t => {
    const sr = data.settings.series.find(x => x.id === t.dataset.id), k = t.dataset.s;
    sr.subjs = sr.subjs.includes(k) ? sr.subjs.filter(x => x !== k) : [...sr.subjs, k]; touch(); render();
  },
  'toggle-subj': t => {
    const e = cur(); if (!e) return; const k = t.dataset.s; e.subjs ??= [];
    e.subjs = e.subjs.includes(k) ? e.subjs.filter(x => x !== k) : [...e.subjs, k];
    const sr = serOf(e); if (sr) sr.subjs = [...e.subjs];
    touch(); render();
  },
  back: () => go({examId:null}),
  'add-exam': t => {
    const type = t.dataset.type || '교육청', off = OFFICIAL_TYPES.includes(type); let needNew = false;
    const d = new Date(), iso = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const e = {id:newId(), name: off ? '새 시험' : (type === '하프' ? '하프 모의고사' : '사설 모의고사'), type, month:null, date:iso, scores:{}, wrongs:[], memo:{}};
    if (!off){
      e.name = ''; e.subjs = []; e.round = null; e.seriesId = null;
      const f = data.settings.series.find(x => x.id === state.ser && x.type === type && !x.hidden);
      const sr = f || lastSeries(type);
      applySeries(e, sr); needNew = !sr;
    }
    data.exams.push(e); touch(); state.reveal = true; go({tab:'exams', examId:e.id, cat: off ? 'official' : 'private', newSer: needNew});
  },
  'del-exam': () => {
    const e = cur(); if (!e || !confirm(`"${examName(e)}"의 성적과 오답 기록을 모두 지울까요?`)) return;
    if (sw.examId === e.id){ Object.assign(sw, {examId:null, subj:null, startAt:0}); saveSw(); syncWake(); }
    for (const w of e.wrongs || []) if (notes.has(w.id)) store.delNote(w.id);
    data.exams = data.exams.filter(x => x.id !== e.id); touch(); go({examId:null});
  },
  'add-wrong': () => {
    const e = cur(); if (!e) return;
    const no = $('#wr-no').value.trim(), note = $('#wr-note').value.trim();
    if (!no && !note){ $('#wr-no').focus(); return; }
    state.wr.subj = $('#wr-subj').value; state.wr.reason = $('#wr-reason').value;
    (e.wrongs ??= []).push({id:newId(), subj:state.wr.subj, no, reason:state.wr.reason, note});
    touch(); render(); $('#wr-no')?.focus();
  },
  'del-wrong': t => {
    const e = cur(), id = t.dataset.id;
    if (hasNote(id) && !confirm('이 오답에 붙인 사진과 텍스트도 함께 지워져요. 지울까요?')) return;
    e.wrongs = e.wrongs.filter(w => w.id !== id); store.delNote(id); touch(); render();
  },
  'wn-open': t => { state.wn = {wrongId:t.dataset.id}; state.crop = null; renderSheet(); $('#sheet')?.scrollTo(0, 0); },
  'wn-close': () => closeSheet(),
  'img-zoom': t => t.closest('.shot')?.classList.toggle('big'),
  'img-del': t => {
    if (!confirm('이 사진을 지울까요?')) return;
    const id = state.wn.wrongId, n = noteOf(id);
    n.imgs = n.imgs.filter(i => i.id !== t.dataset.id); store.delImg(t.dataset.id); store.setNote(id, n); renderSheet();
  },
  'crop-cancel': () => { state.crop = null; renderSheet(); },
  'crop-rot': () => { state.crop.rot = (state.crop.rot + 90) % 360; state.crop.rect = {x:.04, y:.04, w:.92, h:.92}; buildCropSrc(); layoutCrop(); },
  'crop-full': () => { state.crop.rect = {x:0, y:0, w:1, h:1}; placeBox(); },
  'crop-save': t => saveCrop(t.dataset.kind),
  'ocr-run': async () => {
    const id = state.wn.wrongId, n = noteOf(id);
    const pick = n.imgs.filter(i => i.kind === 'prob'); const srcs = [];
    for (const im of (pick.length ? pick : n.imgs)){ const u = await store.getImg(im.id); if (u) srcs.push(u); }
    if (!srcs.length){ toast('사진을 불러오지 못했어요.'); return; }
    if (n.text.trim() && !confirm('지금 텍스트 뒤에 읽은 글자를 덧붙일까요?')) return;
    runOcr(id, srcs);
  },
  'wb-subj': t => { state.wbSubj = t.dataset.s; state.wbLimit = 15; render(); },
  'wb-more': () => { state.wbLimit += 15; const L = $('#wb-list'); if (L){ L.innerHTML = wrongListHtml(); hydrateImgs(L); } },
  'export-json': () => download(JSON.stringify({...data, notes:Object.fromEntries([...notes].filter(([, n]) => n.text.trim()).map(([k, n]) => [k, {text:n.text}]))}, null, 2), `모의고사기록_${data.settings.year}.json`, 'application/json'),
  'export-csv': () => {
    const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
    const rows = [['시험','종류','회차','시행일','과목','원점수','표준점수','백분위','등급','맞은 문항','전체 문항','풀이 시간(분)']];
    for (const e of sortedExams()) for (const s of examSubs(e)){
      const sc = e.scores?.[s.key]; if (!sc || ![...SCORE_KEYS, 'correct', 'total', 'time'].some(k => sc[k] != null)) continue;
      rows.push([examName(e), e.type, e.round ?? '', e.date, s.name, sc.raw, sc.std, sc.pct, sc.grade, sc.correct, sc.total, sc.time != null ? Math.round(sc.time / 6) / 10 : '']);
    }
    rows.push([], ['시험','종류','과목','문항','걸린 시간(초)']);
    for (const e of sortedExams()) for (const s of examSubs(e)) for (const l of e.scores?.[s.key]?.laps || [])
      rows.push([examName(e), e.type, s.name, l.no, Math.round(l.ms / 1000)]);
    rows.push([], ['시험','종류','과목','문항','틀린 이유','메모']);
    for (const e of sortedExams()) for (const w of e.wrongs || [])
      rows.push([examName(e), e.type, subjects().find(s => s.key === w.subj)?.name || w.subj, w.no, w.reason, w.note]);
    download('\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n'), `모의고사기록_${data.settings.year}.csv`, 'text/csv');
  },
  logout: async () => { if (saveTimer) await flush(); await fb.A.signOut(fb.auth); },
  login: () => authDo('login'), signup: () => authDo('signup'), reset: () => authDo('reset'),
};

function download(text, name, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importJson(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.exams)) throw new Error('형식 오류');
      if (!confirm(`불러온 파일의 시험 ${d.exams.length}개로 지금 기록을 바꿀까요? 현재 기록은 사라져요.`)) return;
      data = normalize(d); flush();
      if (d.notes && typeof d.notes === 'object') for (const [k, v] of Object.entries(d.notes)) if (findWrong(k) && v?.text){ const n = noteOf(k); n.text = v.text; store.setNote(k, n); }
      go({tab:'home', examId:null});
    } catch { alert('이 앱에서 내보낸 JSON 파일이 아니에요.'); }
  };
  r.readAsText(file);
}

// ═════════════════════════ 로그인 ═════════════════════════
const AUTH_MSG = {
  'auth/invalid-credential':'이메일이나 비밀번호가 맞지 않아요.',
  'auth/wrong-password':'이메일이나 비밀번호가 맞지 않아요.',
  'auth/user-not-found':'이 이메일로 만든 계정이 없어요.',
  'auth/email-already-in-use':'이미 계정이 있는 이메일이에요. 로그인해 주세요.',
  'auth/weak-password':'비밀번호는 6자 이상이어야 해요.',
  'auth/invalid-email':'이메일 형식을 확인해 주세요.',
  'auth/missing-password':'비밀번호를 입력해 주세요.',
  'auth/too-many-requests':'시도가 너무 많아요. 잠시 뒤 다시 해 주세요.',
  'auth/network-request-failed':'인터넷 연결을 확인해 주세요.',
  'auth/operation-not-allowed':'Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요. 설치 안내 3단계를 확인해 주세요.',
};
function loginMsg(t, ok=false){ const m = $('#loginMsg'); m.textContent = t; m.classList.toggle('ok', ok); }
async function authDo(kind){
  const email = $('#email').value.trim(), pw = $('#pw').value; loginMsg('');
  if (!email){ loginMsg('이메일을 입력해 주세요.'); return; }
  try {
    if (kind === 'login') await fb.A.signInWithEmailAndPassword(fb.auth, email, pw);
    else if (kind === 'signup') await fb.A.createUserWithEmailAndPassword(fb.auth, email, pw);
    else { await fb.A.sendPasswordResetEmail(fb.auth, email); loginMsg('비밀번호 재설정 메일을 보냈어요. 스팸함도 확인해 주세요.', true); }
  } catch (err) { loginMsg(AUTH_MSG[err.code] || `로그인하지 못했어요 (${err.code || err.message})`); }
}

function show(id){ ['boot','login','app'].forEach(x => $('#' + x).hidden = x !== id); }

// ═════════════════════════ 시작 ═════════════════════════
function makeDb(F, app){
  try { return F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentSingleTabManager()})}); }
  catch (err) { console.warn('기기 저장소를 쓸 수 없어 일반 모드로 실행', err); return F.getFirestore(app); }
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('오프라인 준비 실패', err)));
}
let pendingWrites = 0;
const offlineNote = () => navigator.onLine ? '' : ' (오프라인)';
window.addEventListener('online', () => { if (pendingWrites) setSave('연결됨, 올리는 중…'); else if (data) setSave('저장됨'); });
window.addEventListener('offline', () => { if (data) setSave('오프라인: 기기에 보관 중'); });

async function init(){
  loadMedia().then(() => { if (data && state.tab === 'timer') render(); });
  if (mode === 'local'){ user = {email:'로컬 모드'}; await loadData(); await store.loadNotes(); show('app'); render(); setSave('이 기기에 저장'); return; }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
    const [appM, authM, fsM] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
    const app = appM.initializeApp(window.FIREBASE_CONFIG);
    Object.assign(fb, {A:authM, F:fsM, auth:authM.getAuth(app), db:makeDb(fsM, app)});
    fb.auth.languageCode = 'ko';
  } catch (err) {
    console.error(err);
    $('#boot').textContent = '앱을 시작하지 못했어요. 인터넷 연결과 config.js 내용을 확인해 주세요.'; return;
  }
  fb.A.onAuthStateChanged(fb.auth, async u => {
    user = u;
    if (!u){ data = null; show('login'); return; }
    show('boot'); $('#boot').textContent = '기록을 불러오는 중…';
    try { await loadData(); await store.loadNotes(); show('app'); go({tab:'home', examId:null}); setSave(navigator.onLine ? '저장됨' : '오프라인: 기기에 보관 중'); }
    catch (err) {
      console.error(err);
      $('#boot').textContent = err?.code === 'permission-denied'
        ? '기록을 읽을 권한이 없어요. Firestore 보안 규칙을 설치 안내 4단계대로 게시했는지 확인해 주세요.'
        : '기록을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 앱을 다시 열어 주세요.';
    }
  });
}
init();
</script>
