<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모의고사">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>모의고사 기록장</title>
<style>
:root{
  color-scheme:light;
  --paper:#f5f6f8; --card:#ffffff; --ink:#1c2130; --sub:#6a7080; --line:#e3e5ea;
  --field:#eff1f4; --omr:#c92a5b; --omr-weak:#fce8ef; --danger:#c92a2a;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --paper:#101218; --card:#191c24; --ink:#eceef3; --sub:#9aa0ae; --line:#2a2e38;
    --field:#22262f; --omr:#f06595; --omr-weak:#3a1e2a; --danger:#ff6b6b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.5;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}

/* 상단·하단 */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px;background:var(--paper)}
.top h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.03em}
#savestate{font-size:12px;color:var(--sub);white-space:nowrap;padding-bottom:3px}
#savestate.err{color:var(--danger)}
main{max-width:640px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:11px;
  padding:8px 0 6px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs svg,.side svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:700}

/* 공통 */
.card{background:var(--card);border-radius:18px;padding:18px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1.5px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input,textarea{-webkit-appearance:none;appearance:none}
input[type=date]{min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:76px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
.field{margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-size:15px;font-weight:700;
  background:var(--ink);color:var(--card);width:100%}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.back{border:0;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:6px 0}
.notice{border:1.5px dashed var(--omr);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;margin:8px 0}

/* OMR 등급 표기: 이 앱의 핵심 시각 요소 */
.omr{display:grid;grid-template-columns:76px minmax(0,300px) 34px;justify-content:start;gap:10px;align-items:center;padding:7px 0}
.omr + .omr{border-top:1px solid var(--line)}
.omr .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.omr .gr{font-size:20px;font-weight:800;text-align:right}
.bubbles{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.bubbles i{height:24px;border:1.5px solid var(--omr);border-radius:999px;color:var(--omr);
  font-style:normal;font-size:10px;font-weight:600;display:grid;place-items:center}
.bubbles i.goal{background:var(--omr-weak);border-width:2px}
.bubbles i.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:9px;height:13px;border-radius:9px;margin-right:5px;vertical-align:-2px}
.legend .l1::before{background:var(--ink)}
.legend .l2::before{background:var(--omr-weak);border:2px solid var(--omr)}

/* 시험 목록 */
.exam{display:flex;gap:12px;align-items:center;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;
  border:1.5px solid var(--omr);color:var(--omr)}
.tag.plain{border-color:var(--line);color:var(--sub)}
.gline{font-size:13px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.gline b{color:var(--ink);font-weight:700}
.chev{color:var(--sub);font-size:22px}

/* 상세 */
.subj{padding:12px 0}
.subj + .subj{border-top:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.grid4 input,.grid2 input{text-align:center;padding:10px 4px}
.wform{display:grid;grid-template-columns:1fr 84px;gap:6px;margin-bottom:6px}
.wrong{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.wrong .no{font-weight:800;min-width:42px}
.x{border:0;background:none;color:var(--sub);font-size:20px;padding:2px 8px;line-height:1}

/* 통계 막대 */
.barrow{display:grid;grid-template-columns:78px 1fr 26px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bar{height:10px;border-radius:5px;background:var(--omr)}
.bar.ink{background:var(--ink)}
.chartbox{position:relative;height:270px}

/* 로그인 */
.center{min-height:100vh;display:grid;place-items:center;color:var(--sub);padding:24px;text-align:center}
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 64px) 24px 40px}
.login h1{font-size:28px;letter-spacing:-.03em;margin:16px 0 4px}
.login .bubbles{max-width:240px}
#loginMsg{font-size:14px;min-height:21px;margin:10px 0;color:var(--danger)}
#loginMsg.ok{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;padding:8px 0;margin-top:6px}
/* 공식/사설 구분 탭, 필터 */
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;margin:8px 0 8px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--sub);padding:9px 6px;border-radius:9px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{font-size:12px;font-weight:500;color:var(--sub);margin-left:5px}
.chipsrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chipsrow.wrap{flex-wrap:wrap;overflow:visible}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;min-height:36px}
.fchip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.missing{color:var(--omr);font-weight:700}
input.req:placeholder-shown{border-color:var(--omr)}
input::placeholder{color:var(--sub);opacity:.7}
.ratebox{display:grid;place-items:center;height:46px;border-radius:10px;border:1.5px dashed var(--line);font-weight:800;font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid3 input{text-align:center;padding:10px 4px}
.hint{font-size:12px;color:var(--sub);margin:-4px 0 6px}

.pmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px 6px}
.pmeta .full{grid-column:1/-1}
@container (min-width:560px){ .pmeta{grid-template-columns:2fr .8fr 1fr 1.3fr} .pmeta .full{grid-column:auto} }
.pmeta .span{grid-column:1/-1}
.roundbox{position:relative}
.roundbox input{padding-right:30px;text-align:center}
.roundbox span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.newser{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.serrow{padding:10px 0;border-top:1px solid var(--line)}
.serrow:first-of-type{border-top:0}
.serrow .row{gap:6px}
.serrow.hidden input{opacity:.5}
.chipsrow.sm .fchip{padding:4px 10px;font-size:12px;min-height:30px}

/* 한눈에 카드 편집 */
.homebar{display:flex;justify-content:flex-end;margin:2px 0 -4px}
.erow{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.erow.off .grow{opacity:.45}
.etools{display:flex;gap:6px;align-items:center;flex:none}
.ibtn{min-width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:700;padding:0}
.ibtn.wide{font-size:13px;padding:0 10px}
.ibtn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ibtn:disabled{opacity:.3}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--ink)}
.sw.on i{left:23px;background:var(--card)}
@media (prefers-reduced-motion:no-preference){ .sw i{transition:left .15s} }
.dday .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:12px 0 6px}
@media (min-width:1024px) and (min-height:560px){
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;grid-auto-flow:row dense;align-items:start}
  .hgrid .w2{grid-column:1/-1}
}

/* 타이머 */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tsub{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.tsub b{font-size:15px}
.tsub span{font-size:12px;color:var(--sub)}
.tsub.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tsub.on span{color:var(--card);opacity:.8}
.tsub:disabled{opacity:.45}
.tsub.on:disabled{opacity:1}
.btn:disabled{opacity:.45;cursor:default}
.tcard{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--field);stroke-width:10}
.ring .bar2{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round}
.ring.low .bar2{stroke:var(--omr)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tm-time{font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1}
.ring.low #tm-time{color:var(--omr)}
#tm-sub{font-size:14px;color:var(--sub)}
.tbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px;width:100%;max-width:360px}
.tbtns .btn{white-space:nowrap;padding-left:6px;padding-right:6px}
#tm-msg{min-height:24px;margin:10px 0 0;font-weight:700;color:var(--omr)}
.tabs button.run,.side nav button.run{position:relative}
.tabs button.run::after{content:"";position:absolute;top:7px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--omr)}
.side nav button.run::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--omr);margin-left:auto}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--card);
  padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;z-index:50;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){ #toast{transition:transform .25s} .ring .bar2{transition:stroke-dashoffset .25s linear} }
/* 풀이 시간 측정 */
.swrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:6px;align-items:center;padding:10px 0}
.swrow + .swrow{border-top:1px solid var(--line)}
.swclock{font-size:22px;font-weight:800;min-width:76px;text-align:right}
.swrow.running .swclock{color:var(--omr)}
.swbtn{min-width:64px}
@media (min-width:700px) and (min-height:560px){ .tgrid{grid-template-columns:repeat(4,1fr)} .ring{width:320px} }

/* 전체화면 */
html.fs-on, html.fs-on body{overflow:hidden}
.fs{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px))}
.fs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fs-t1{font-size:20px;font-weight:800;line-height:1.3}
.fs-t2{font-size:14px;color:var(--sub)}
.fs-close{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:10px 16px;flex:none}
.fs-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;text-align:center}
.fs-label{font-size:clamp(15px,2.6vw,24px);font-weight:700;color:var(--sub)}
.fs-time{font-size:min(23vw,38vh);font-weight:800;letter-spacing:-.03em;line-height:1}
.fs-time.long{font-size:min(17vw,30vh)}
.fs.over .fs-time,.fs.over .fs-label,.fs.low .fs-time{color:var(--omr)}
.fs-sub{font-size:clamp(14px,2.2vw,20px);color:var(--sub);min-height:1.5em}
.fs-prog{width:min(560px,82%);height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:14px}
.fs-prog i{display:block;height:100%;background:var(--ink);width:0}
.fs.over .fs-prog i,.fs.low .fs-prog i{background:var(--omr)}
.fs-bot{display:flex;flex-direction:column;align-items:center;gap:14px}
.fs-target{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.fs-tgv{border:0;background:var(--field);color:var(--ink);font:inherit;font-size:17px;font-weight:800;border-radius:10px;min-width:88px;height:40px}
.fs-main{max-width:420px;padding:18px;font-size:18px}
@media (orientation:landscape) and (max-height:520px){ .fs-bot{flex-direction:row;justify-content:center} .fs-main{width:auto;min-width:220px;padding:14px} .fs-prog{margin-top:6px} }
.swfs{width:40px;height:40px}
.swfs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* 문항별 랩 */
.fs-lap{font-size:clamp(15px,2.4vw,22px);font-weight:700;min-height:1.5em;margin-top:6px}
.fs-btns{display:grid;grid-template-columns:2fr 1fr;gap:10px;width:100%;max-width:520px}
.fs-btns .fs-main{max-width:none}
.fs-undo{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;padding:4px}
.laps{margin-top:6px}
.laprow{display:grid;grid-template-columns:52px minmax(0,1fr) 52px auto 32px;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.laprow .lno{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;padding:4px 0}
.laprow .lt{text-align:right;font-weight:700}
.laprow.max .lt{color:var(--omr)}
.laprow.max .bar{background:var(--omr)}
.laprow .bar{background:var(--ink)}
.lapw{border:1.5px solid var(--omr);background:none;color:var(--omr);font:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:5px 8px;white-space:nowrap}
.lapw:disabled{border-color:var(--line);color:var(--sub)}
.lapsum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:4px 0 2px}
.lapsum b{color:var(--ink)}

/* 오답 노트 */
.sheet{position:fixed;inset:0;z-index:45;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(16px,env(safe-area-inset-left,0px))}
.sheet .sh-in{max-width:720px;margin:0 auto}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:calc(-14px - env(safe-area-inset-top,0px));background:var(--paper);padding:4px 0 8px;z-index:2}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.shot{position:relative;margin:0;border-radius:12px;overflow:hidden;background:var(--field)}
.shot img{display:block;width:100%;height:140px;object-fit:contain;background:#fff;cursor:zoom-in}
.shot.prob{grid-column:1/-1}
.shot.prob img{height:auto;max-height:340px}
.shot.big{grid-column:1/-1}
.shot.big img{height:auto;max-height:none;cursor:zoom-out}
.shot figcaption{font-size:12px;font-weight:700;padding:5px 8px;color:var(--sub)}
.shot .x{position:absolute;top:4px;right:4px;background:var(--card);border-radius:50%;width:30px;height:30px;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cropwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;border-radius:12px;background:#111;margin:6px 0 10px}
#cropCv{display:block;margin:0 auto}
.cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);touch-action:none;cursor:move}
.cropbox i{position:absolute;width:36px;height:36px;margin:-18px;display:grid;place-items:center}
.cropbox i::after{content:"";width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.cropbox i[data-h=nw]{left:0;top:0;cursor:nwse-resize} .cropbox i[data-h=ne]{right:0;top:0;cursor:nesw-resize}
.cropbox i[data-h=sw]{left:0;bottom:0;cursor:nesw-resize} .cropbox i[data-h=se]{right:0;bottom:0;cursor:nwse-resize}
.wopen{flex:1;min-width:0;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer}
.wbadge{font-size:12px;color:var(--omr);font-weight:700;margin-top:2px}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--field);flex:none}
.thumb.ph{display:grid;place-items:center;font-size:10px;color:var(--sub);text-align:center;line-height:1.2;padding:2px}
.wbitem{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;padding:10px 0;cursor:pointer}
.wbitem .grow{display:flex;flex-direction:column;gap:2px}
.wbitem .d{font-size:12px}

.colhead h2{margin:0;flex:1;min-width:0;font-size:20px}

.ovl{z-index:46}

.setlabel:first-child{margin-top:0}

.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}

const CIRC = ['①','②','③','④','⑤'];
function normWrong(w){
  const o = {...w, id:w.id || newId(), cols:Array.isArray(w.cols) ? w.cols : []};
  if (!(o.ans && (o.ans.type === 'mc' || o.ans.type === 'short') && String(o.ans.v ?? '').trim())) delete o.ans;
  if (o.mine == null) delete o.mine;
  return o;
}
const ansText = a => !a ? '' : a.type === 'mc' ? (CIRC[Number(a.v) - 1] || a.v) : String(a.v);
const mineText = w => w.mine == null || w.mine === '' ? '' : (w.ans?.type === 'short' ? String(w.mine) : (CIRC[Number(w.mine) - 1] || String(w.mine)));
function normalize(d){
  const base = defaultData();
  if (!d || typeof d !== 'object') return base;
  const s = {...base.settings, ...(d.settings || {})};
  s.goals = {...base.settings.goals, ...(s.goals || {})};
  s.elective = {...base.settings.elective, ...(s.elective || {})};
  s.names = {...base.settings.names, ...(s.names || {})};
  s.layout = {phone: normLayout(s.layout?.phone), tablet: normLayout(s.layout?.tablet)};
  s.collections = Array.isArray(s.collections) ? s.collections.filter(c => c && c.id).map(c => ({id:c.id, name:c.name || '이름 없는 모음집', createdAt:c.createdAt || Date.now(), auto:c.auto || ''})) : [];
  if (!s.defColsDone){
    // 통합사회·통합과학 모음집을 처음 한 번 만들어 두고, 그 과목 오답은 자동으로 담기게 함
    for (const [k, nm] of [['s1','통합사회'], ['s2','통합과학']])
      if (!s.collections.some(c => c.auto === k)) s.collections.push({id:'col-' + k, name:nm, createdAt:Date.now(), auto:k});
    s.defColsDone = true;
  }
  s.series = Array.isArray(s.series) ? s.series.map(x => ({id:x.id || newId(), name:x.name || '이름 없음', type:x.type === '하프' ? '하프' : '사설', subjs:Array.isArray(x.subjs) ? x.subjs : [], hidden:!!x.hidden, targets: x.targets && typeof x.targets === 'object' ? x.targets : {}})) : [];
  const exams = Array.isArray(d.exams) ? d.exams.map(e => {
    const o = {
      id:e.id || newId(), name:e.name || '시험', type:e.type || '사설', month:e.month ?? null, date:e.date || '',
      scores:e.scores || {}, wrongs:Array.isArray(e.wrongs) ? e.wrongs.map(normWrong) : [], memo:e.memo || {},
    };
    if (e.loose){ Object.assign(o, {loose:true, type:LOOSE_TYPES.includes(e.type) ? e.type : '교재', round:e.round ?? null, subjs:[...ALL_KEYS]}); return o; }
    if (OFFICIAL_TYPES.includes(o.type)) return o;
    o.subjs = Array.isArray(e.subjs) ? e.subjs : [...ALL_KEYS];
    o.round = e.round ?? null;
    o.seriesId = e.seriesId ?? null;
    if (!('seriesId' in e)){
      // 예전 기록: "이름 N회"를 이름과 회차로 나눔 (출제처 칸은 없앰)
      let base = (e.name || '').trim(), round = null;
      const m = base.match(/^(.*?)\s*(\d+)\s*회\s*$/);
      if (m){ base = m[1].trim(); round = Number(m[2]); }
      if ((!base || base === '사설 모의고사' || base === '하프 모의고사') && e.source) base = String(e.source).trim();
      if (base){
        let ser = s.series.find(x => x.type === o.type && x.name === base);
        if (!ser){ ser = {id:newId(), name:base, type:o.type, subjs:[...o.subjs], hidden:false}; s.series.push(ser); }
        else ser.subjs = [...o.subjs];
        o.seriesId = ser.id;
      }
      o.round = round;
    }
    return o;
  }) : base.exams;
  return {v:1, settings:s, exams};
}

function subjects(){

  const list = [
    {key:'ko', name: old && s.elective.ko ? `국어(${s.elective.ko})` : '국어'},
    {key:'ma', name: old && s.elective.ma ? `수학(${s.elective.ma})` : '수학'},
    {key:'en', name:'영어', abs:'en'},
    {key:'hi', name:'한국사', abs:'hi'},
    {key:'s1', name: old ? (s.names.s1 || '탐구1') : '통합사회'},
    {key:'s2', name: old ? (s.names.s2 || '탐구2') : '통합과학'},
  ];
  if (s.useFl) list.push({key:'fl', name: s.names.fl || '제2외국어/한문', abs:'fl'});

}

const hasScore = e => Object.values(e.scores || {}).some(sc => sc && (isHalf(e) ? sc.correct != null : SCORE_KEYS.some(k => sc[k] != null)));
const rateOf = sc => sc && sc.correct != null && sc.total ? Math.round(sc.correct / sc.total * 100) : null;
const missingOf = e => {
  if (isOfficial(e)) return '';
  const subs = examSubs(e);

  return miss ? (isHalf(e) ? '문항 수 미입력' : '원점수 미입력') : '';

const scoreText = (e, s) => {
  const sc = e.scores?.[s.key] || {};
  if (isHalf(e)) return sc.correct == null ? '–' : `${sc.correct}/${sc.total ?? '?'}`;

const serOf = e => data.settings.series.find(x => x.id === e.seriesId) || null;
const examName = e => {

const serLabel = x => data.settings.series.some(y => y !== x && y.name === x.name) ? `${x.name}(${x.type})` : x.name;
const nextRound = (sid, exceptId) => {
  const rs = data.exams.filter(e => e.seriesId === sid && e.id !== exceptId);
  if (!rs.length) return 1;

function lastSeries(type){
  const ex = data.exams.filter(e => e.type === type && e.seriesId && serOf(e) && !serOf(e).hidden);
  if (ex.length){
    ex.sort((a,b) => (a.date || '').localeCompare(b.date || '') || (a.round ?? 0) - (b.round ?? 0));
    return serOf(ex[ex.length - 1]);
  }
  const all = data.settings.series.filter(x => x.type === type && !x.hidden);
  return all[all.length - 1] || null;
}
function applySeries(e, sr){
  e.seriesId = sr ? sr.id : null;
  if (sr){ e.subjs = [...sr.subjs]; e.round = nextRound(sr.id, e.id); }
}
function addSeries(name, type, subjs){

let saveTimer = null;
function setSave(t, err=false){ const el = $('#savestate'); el.textContent = t; el.classList.toggle('err', err); }
function touch(){ setSave('저장 대기…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!data) return;
  const payload = JSON.parse(JSON.stringify(data));
  if (mode === 'local'){
    try { localStorage.setItem(LS_KEY, JSON.stringify(payload)); setSave('이 기기에 저장됨'); }
    catch (err) { console.error(err); setSave('저장 실패: 저장 공간 확인', true); }
    return;
  }
  // Firestore는 쓰기를 기기에 먼저 보관하고, 연결되면 서버로 올림
  pendingWrites++;
  setSave(navigator.onLine ? '저장 중…' : '오프라인: 기기에 보관 중');
  fb.F.setDoc(fb.F.doc(fb.db, 'users', user.uid), payload)
    .then(() => { pendingWrites = Math.max(0, pendingWrites - 1); if (!pendingWrites) setSave('저장됨'); })
    .catch(err => {
      pendingWrites = Math.max(0, pendingWrites - 1); console.error(err);
      setSave(err?.code === 'permission-denied' ? '저장 거부됨: 보안 규칙 확인' : '저장 실패, 10초 뒤 다시 시도', true);
      if (err?.code !== 'permission-denied') saveTimer = setTimeout(flush, 10000);
    });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flush(); });

async function loadData(){
  if (mode === 'local'){
    let raw = null; try { raw = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
    data = normalize(raw);
    if (!raw) flush();
    return;
  }
  const ref = fb.F.doc(fb.db, 'users', user.uid);
  let snap;
  try { snap = await fb.F.getDoc(ref); }
  catch (err) { if (err?.code === 'unavailable') snap = await fb.F.getDocFromCache(ref); else throw err; }
  data = normalize(snap.exists() ? snap.data() : null);
  if (!snap.exists()) await flush();
}

function bubbleRow(name, g, goal){
  let b = '';
  for (let n = 1; n <= 9; n++) b += `<i class="${n===g?'on':''} ${n===goal?'goal':''}">${n}</i>`;
  return `<div class="omr"><span class="nm">${esc(name)}</span><span class="bubbles" aria-hidden="true">${b}</span>
    <span class="gr" aria-label="${esc(name)} ${g ?? '미입력'}등급">${g ?? '–'}</span></div>`;
}
function barRow(label, n, max, ink){
  return `<div class="barrow"><span>${esc(label)}</span><div><div class="bar ${ink?'ink':''}" style="width:${Math.max(6, n/max*100)}%"></div></div><b style="text-align:right">${n}</b></div>`;
}

const CARD_INFO = {
  omr:['최근 공식 시험 등급','가장 최근 공식 시험의 과목별 등급과 목표'],
  dday:['수능 D-day','수능과 다음 공식 시험까지 남은 날'],
  next:['다음 기록할 시험','아직 성적을 넣지 않은 공식 시험'],
  trend:['성적 추이','대상과 과목은 카드에서 바꿔요'],
  reasons:['오답 원인','모든 시험의 틀린 이유 통계'],
  subjWrongs:['과목별 오답 수','과목마다 틀린 문항 수'],
  offTable:['공식 시험 성적표','회차별 등급과 백분위 표'],
  privTable:['사설·하프 기록 표','사설·하프 점수를 최근 순으로'],
};
const FIXED_CARDS = ['omr','dday','next','reasons','subjWrongs','offTable','privTable'];
const devKey = () => isWide() ? 'tablet' : 'phone';
const newTrend = target => ({id:newId(), type:'trend', size:'n', hidden:false, cfg:{target, metric:'grade', subj:'ma'}});
function defaultLayout(dev){
  const c = (type, size='n', hidden=false) => ({id:type, type, size, hidden});
  return dev === 'tablet'
    ? [c('omr'), newTrend('official'), c('dday'), c('next'), newTrend('priv:all'), c('reasons'), c('subjWrongs'), c('offTable','w'), c('privTable','w')]
    : [c('omr'), c('dday'), c('next'), newTrend('official'), newTrend('priv:all'), c('reasons'), c('subjWrongs'), c('offTable','w',true), c('privTable','w',true)];
}
function normLayout(arr){
  if (!Array.isArray(arr)) return null;
  const out = [], seen = new Set();
  for (const it of arr){
    if (!it || !CARD_INFO[it.type]) continue;
    if (it.type !== 'trend'){ if (seen.has(it.type)) continue; seen.add(it.type); }
    const o = {id: it.type === 'trend' ? (it.id || newId()) : it.type, type:it.type, size: it.size === 'w' ? 'w' : 'n', hidden:!!it.hidden};
    if (it.type === 'trend') o.cfg = {target:it.cfg?.target || 'official', metric:it.cfg?.metric || 'grade', subj:it.cfg?.subj || 'ma'};
    out.push(o);
  }
  for (const t of FIXED_CARDS) if (!seen.has(t)) out.push({id:t, type:t, size: t.endsWith('Table') ? 'w' : 'n', hidden:false});
  return out;
}
function layout(){
  const L = (data.settings.layout ??= {phone:null, tablet:null}), k = devKey();
  if (!L[k]) L[k] = defaultLayout(k);
  return L[k];
}

const toDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const dayDiff = iso => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((toDate(iso) - t) / 86400000); };
const dLabel = n => n > 0 ? `D-${n}` : n === 0 ? 'D-day' : `D+${-n}`;
const fullDate = iso => { const d = toDate(iso); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; };

function privTableCard(){

// ── 추이 카드 (여러 개 가능) ──
function trendTargets(){
  const o = [['official','공식 시험'],['priv:all','사설·하프 전체'],['priv:사설','사설 전체'],['priv:하프','하프 전체']];
  data.settings.series.filter(x => !x.hidden || data.exams.some(e => e.seriesId === x.id)).forEach(x => o.push([x.id, serLabel(x)]));
  return o;
}
function trendTitle(cfg){
  const t = cfg.target;
  if (t === 'official') return '공식 시험 추이';
  if (t === 'priv:all') return '사설·하프 추이';
  if (t === 'priv:사설') return '사설 추이';
  if (t === 'priv:하프') return '하프 추이';
  const sr = data.settings.series.find(x => x.id === t);
  return sr ? `${sr.name} 추이` : '성적 추이';
}
function trendData(cfg){
  if (cfg.target === 'official') return sortedExams().filter(isOfficial).filter(hasScore);
  const k = cfg.subj, t = cfg.target;
  return sortedExams().filter(e => !isOfficial(e)
    && (t === 'priv:all' || (t === 'priv:사설' && e.type === '사설') || (t === 'priv:하프' && e.type === '하프') || e.seriesId === t)
    && (e.subjs || []).includes(k) && (isHalf(e) ? e.scores?.[k]?.correct != null : e.scores?.[k]?.raw != null));
}
function trendCard(it){
  const cfg = it.cfg, subs = subjects(), targets = trendTargets();
  if (!targets.some(([v]) => v === cfg.target)) cfg.target = 'priv:all';
  if (!subs.find(s => s.key === cfg.subj)) cfg.subj = subs[0].key;
  const off = cfg.target === 'official', list = trendData(cfg);
  const sel = (k, opts, cv, label) => `<select data-trend="${it.id}" data-k="${k}" aria-label="${label}">${opts.map(([v,l]) => `<option value="${esc(v)}" ${v===cv?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  let body;
  if (list.length){
    body = `<div class="chartbox"><canvas id="tc-${it.id}"></canvas></div>`;
    if (!off && list.some(isHalf) && list.some(e => !isHalf(e))) body += `<p class="hint" style="margin:8px 0 0">실선은 사설 원점수(왼쪽 눈금), 점선은 하프 정답률 %(오른쪽 눈금)예요.</p>`;
    else if (!off && list.every(isHalf)) body += `<p class="hint" style="margin:8px 0 0">하프는 정답률(%)로 그려요.</p>`;
  } else body = `<p class="sub" style="margin:0">${off ? '공식 시험 성적을 입력하면 흐름이 보여요.' : '이 조건에 맞는 기록이 아직 없어요.'}</p>`;
  return `<section class="card"><h2>${esc(trendTitle(cfg))}</h2>
    <div class="grid2" style="margin:0 0 10px">${sel('target', targets, cfg.target, '그래프 대상')}${off ? sel('metric', METRICS, cfg.metric, '지표') : sel('subj', subs.map(s => [s.key, s.name]), cfg.subj, '과목')}</div>${body}</section>`;
}
function drawTrend(it){
  const c = document.getElementById('tc-' + it.id); if (!c || !window.Chart) return;
  const cfg = it.cfg, list = trendData(cfg);
  const css = getComputedStyle(document.documentElement);
  const sub = css.getPropertyValue('--sub').trim(), line = css.getPropertyValue('--line').trim();
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const legend = {position:'bottom', labels:{color:sub, usePointStyle:true, boxWidth:8, boxHeight:8, padding:12}};
  let config;
  if (cfg.target === 'official'){
    const m = cfg.metric, subs = subjects().filter(s => !(s.abs && (m === 'std' || m === 'pct')));
    config = { type:'line',
      data:{ labels: list.map(e => short(e.name)),
        datasets: subs.map((s,i) => ({ label:s.name, data: list.map(e => e.scores?.[s.key]?.[m] ?? null),
          borderColor:COLORS[i % COLORS.length], backgroundColor:COLORS[i % COLORS.length], spanGaps:true, tension:.25, pointRadius:4, borderWidth:2 })) },
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, plugins:{legend},
        scales:{ x:{ ticks:{color:sub}, grid:{display:false} },
          y:{ reverse: m === 'grade', min: m === 'grade' ? 1 : undefined, max: m === 'grade' ? 9 : (m === 'pct' ? 100 : undefined),
              ticks:{color:sub, stepSize: m === 'grade' ? 1 : undefined}, grid:{color:line} } } } };
  } else {
    const k = cfg.subj, single = !cfg.target.startsWith('priv:');
    const hasP = list.some(e => !isHalf(e)), hasH = list.some(isHalf), ds = [];
    if (hasP) ds.push({ label:'사설 원점수', yAxisID:'y', data: list.map(e => isHalf(e) ? null : e.scores[k].raw),
      borderColor:COLORS[0], backgroundColor:COLORS[0], spanGaps:true, tension:.25, pointRadius:4, borderWidth:2 });
    if (hasH) ds.push({ label:'하프 정답률(%)', yAxisID:'y1', data: list.map(e => isHalf(e) ? rateOf(e.scores[k]) : null),
      borderColor:COLORS[1], backgroundColor:COLORS[1], borderDash:[6,4], spanGaps:true, tension:.25, pointRadius:4, pointStyle:'rectRot', borderWidth:2 });
    const lab = e => single && e.round != null ? `${e.round}회` : (e.date ? `${+e.date.slice(5,7)}/${+e.date.slice(8,10)}` : (e.round != null ? `${e.round}회` : '–'));
    config = { type:'line', data:{ labels: list.map(lab), datasets: ds },
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        plugins:{ legend, tooltip:{ callbacks:{
          title: items => { const e = list[items[0].dataIndex]; return `${examName(e)}${e.date ? ` (${fmtDate(e.date)})` : ''}`; },
          label: x => { const e = list[x.dataIndex], sc = e.scores[k]; return isHalf(e) ? `하프 ${sc.correct}/${sc.total ?? '?'} (${rateOf(sc) ?? '?'}%)` : `사설 원점수 ${sc.raw}점`; } } } },
        scales:{ x:{ ticks:{color:sub, maxRotation:0, autoSkip:true}, grid:{display:false} },
          y:{ display:hasP, position:'left', ticks:{color:sub}, grid:{color:line}, title:{display:true, text:'원점수', color:sub} },
          y1:{ display:hasH, position:'right', min:0, max:100, ticks:{color:sub}, grid:{drawOnChartArea:!hasP, color:line}, title:{display:true, text:'정답률 %', color:sub} } } } };
  }
  charts.push(new Chart(c, config));
}

// ═════════════════════════ 화면: 시험 목록·상세 ═════════════════════════
function catExams(){
  const list = sortedExams().filter(e => catOf(e) === state.cat && (state.cat === 'official' || !state.ser || e.seriesId === state.ser));
  if (state.cat === 'official') return list;
  return list.sort((a,b) => (b.date || '').localeCompare(a.date || '') || (b.round ?? 0) - (a.round ?? 0));
}
function examsHeader(){
  const nOff = data.exams.filter(isOfficial).length, nPriv = data.exams.filter(e => !e.loose).length - nOff;
  let h = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${state.cat==='official'}" class="${state.cat==='official'?'on':''}" data-act="cat" data-cat="official">공식 시험<span class="n">${nOff}</span></button>
    <button role="tab" aria-selected="${state.cat==='private'}" class="${state.cat==='private'?'on':''}" data-act="cat" data-cat="private">사설·하프<span class="n">${nPriv}</span></button></div>`;
  if (state.cat === 'private'){
    const sers = usedSeries(); if (state.ser && !sers.some(x => x.id === state.ser)) state.ser = '';
    if (sers.length) h += `<div class="chipsrow" aria-label="시험 이름"><button class="fchip ${!state.ser?'on':''}" data-act="ser" data-id="">전체</button>${sers.map(x => `<button class="fchip ${state.ser===x.id?'on':''}" data-act="ser" data-id="${x.id}">${esc(serLabel(x))}</button>`).join('')}</div>`;
    h += `<div class="grid2" style="margin:2px 0 4px"><button class="btn ghost" data-act="add-exam" data-type="사설">사설 추가</button><button class="btn ghost" data-act="add-exam" data-type="하프">하프 추가</button></div>`;
  } else h += `<button class="btn ghost" data-act="add-exam" data-type="교육청" style="margin:2px 0 4px">공식 시험 추가</button>`;
  return h;
}
function examItem(e, inSplit){
  const off = isOfficial(e), subs = examSubs(e), filled = hasScore(e), nW = (e.wrongs || []).length;
  const active = inSplit && e.id === state.examId, miss = missingOf(e);
  const when = e.date ? fmtDate(e.date) : (e.month ? `${e.month}월, 날짜 미정` : '날짜 미정');
  let line;
  if (off) line = filled ? subs.map(s => `<span>${esc(s.name)} <b>${e.scores?.[s.key]?.grade ?? '–'}</b></span>`).join('') : '<span>아직 기록 없음</span>';
  else line = subs.map(s => { const t = minText(e.scores?.[s.key]?.time); return `<span>${esc(s.name)} <b>${scoreText(e, s)}</b>${t ? ` (${t})` : ''}</span>`; }).join('') + (miss ? `<span class="missing">${miss}</span>` : '');

const emptyCat = () => `<section class="card"><p class="sub" style="margin:0">${state.cat === 'private'

const wake = {
  lock:null, video:null, want:false,
  async on(){
    this.want = true;
    if (this.lock) return;
    try {
      if ('wakeLock' in navigator){
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => { this.lock = null; });
        return;
      }
    } catch {}
    // Wake Lock을 못 쓰는 기기: 소리 없는 영상을 반복 재생해 화면 꺼짐을 막음
    if (!this.video){
      const v = document.createElement('video');
      Object.assign(v, {muted:true, loop:true, playsInline:true, src:NOSLEEP_MP4});
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;left:0';
      document.body.appendChild(v); this.video = v;
    }
    this.video.play().catch(() => {});
  },
  off(){
    this.want = false;
    this.lock?.release().catch(() => {}); this.lock = null;
    this.video?.pause();
  },
};
function syncWake(){ (timer.running || sw.examId) ? wake.on() : wake.off(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wake.want) { wake.lock = null; wake.on(); } });

let actx = null;
function ensureSound(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try { actx ??= new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {}
}
function beep(pattern){
  if (!actx) return;
  let t = actx.currentTime + 0.05;
  for (const [f, d, gap] of pattern){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.05); t += d + gap;
  }
}
const BEEP_WARN = [[880,.18,.12],[880,.18,0]];
const BEEP_END = [[988,.35,.15],[784,.35,.15],[988,.35,.15],[784,.6,0]];
function toast(msg, sticky=false){
  let t = $('#toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','alert'); document.body.appendChild(t); t.onclick = () => t.classList.remove('show'); }
  t.textContent = msg; t.classList.add('show'); clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), sticky ? 15000 : 5000);
}

const idb = {
  p:null,
  open(){ return this.p ??= new Promise((res, rej) => { const r = indexedDB.open('mocklog-media', 2);
    r.onupgradeneeded = () => { const db = r.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      for (const n of ['notes','images']) if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, {keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async tx(name, mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(name, mode), q = fn(t.objectStore(name)); t.oncomplete = () => res(q?.result ?? null); t.onerror = () => rej(t.error); }); },
  get(k){ return this.tx('files', 'readonly', st => st.get(k)); },
  set(k, v){ return this.tx('files', 'readwrite', st => st.put(v, k)); },
  del(k){ return this.tx('files', 'readwrite', st => st.delete(k)); },
  getFrom(n, k){ return this.tx(n, 'readonly', st => st.get(k)); },
  put(n, v){ return this.tx(n, 'readwrite', st => st.put(v)); },
  remove(n, k){ return this.tx(n, 'readwrite', st => st.delete(k)); },
  all(n){ return this.tx(n, 'readonly', st => st.getAll()); },
};
const enAudio = new Audio(); enAudio.preload = 'auto'; enAudio.setAttribute('playsinline', '');
let media = null, previewing = false;
enAudio.addEventListener('ended', () => { if (previewing){ previewing = false; if (state.tab === 'timer') render(); } });
async function loadMedia(){
  try {
    const rec = await idb.get('en-listening');
    if (rec?.blob){ if (enAudio.src) URL.revokeObjectURL(enAudio.src); enAudio.src = URL.createObjectURL(rec.blob); media = {name:rec.name, duration:rec.duration}; }
    else media = null;
  } catch (err) { console.error(err); media = null; }
}
function audioDuration(file){
  return new Promise(res => { const a = new Audio(), u = URL.createObjectURL(file);
    a.preload = 'metadata'; a.onloadedmetadata = () => { res(a.duration); URL.revokeObjectURL(u); }; a.onerror = () => { res(null); URL.revokeObjectURL(u); }; a.src = u; });
}
async function saveAudio(file){
  if (!file.type.startsWith('audio') && !/\.(mp3|m4a|aac|wav|ogg)$/i.test(file.name)){ alert('음원 파일(mp3, m4a 등)을 골라 주세요.'); return; }
  toast('음원을 저장하는 중…');
  try {
    const duration = await audioDuration(file);
    await idb.set('en-listening', {blob:file, name:file.name, duration});
    navigator.storage?.persist?.().catch(() => {});
    await loadMedia(); if (timer.subj === 'en' && !timerStarted()) setTimerSubj('en');
    toast('음원을 저장했어요. 영어 시간이 70분으로 바뀌었어요.'); render();
  } catch (err) { console.error(err); alert('음원을 저장하지 못했어요. 기기 저장 공간을 확인해 주세요.'); }
}

const timer = { subj:null, total:0, remain:0, endAt:0, running:false, done:false, warned:{w10:false, w5:false}, audio:false, laps:[] };
const LAP_SUBJ = ['ko'];
const tElapsed = () => timer.total - (timer.running ? Math.max(0, timer.endAt - Date.now()) : timer.remain);
const tLapSum = () => timer.laps.reduce((a, b) => a + b, 0);
function timerLap(){ const ms = Math.max(0, tElapsed() - tLapSum()); if (ms < 1000) return; timer.laps.push(ms); }
function lapLine(){
  if (!LAP_SUBJ.includes(timer.subj) || !timerStarted()) return '';
  const last = timer.laps[timer.laps.length - 1];
  return `${timer.laps.length + 1}구간 ${clock(Math.max(0, tElapsed() - tLapSum()), true)}${last ? `, 직전 ${clock(last, true)}` : ''}`;
}
function lapTableHtml(){
  if (!timer.laps.length) return '';
  const max = Math.max(...timer.laps); let acc = 0;
  return `<div class="laps" style="width:100%;max-width:420px;margin-top:12px;text-align:left"><div class="lapsum"><span>구간 <b>${timer.laps.length}개</b></span><span>평균 <b>${clock(tLapSum() / timer.laps.length, true)}</b></span></div>`
    + timer.laps.map((ms, i) => { acc += ms; return `<div class="laprow ${ms === max ? 'max' : ''}" style="grid-template-columns:56px minmax(0,1fr) 62px 86px"><b>${i + 1}구간</b><div><div class="bar" style="height:8px;border-radius:4px;width:${Math.max(4, ms / max * 100)}%"></div></div><span class="lt">${clock(ms, true)}</span><span class="sub" style="text-align:right;white-space:nowrap">누적 ${clock(acc, true)}</span></div>`; }).join('') + `</div>`;
}
function timerMinutes(key){
  const old = data.settings.system === 'old';
  return {ko:80, ma:100, en: media ? 70 : 50, hi:30, s1: old ? 30 : 40, s2: old ? 30 : 40, fl:40}[key] ?? 60;
}
const timerStarted = () => timer.subj && (timer.running || timer.remain < timer.total);
function setTimerSubj(k){
  stopPreview();
  Object.assign(timer, {subj:k, total:timerMinutes(k) * 60000, running:false, done:false, warned:{w10:false, w5:false}, audio: k === 'en' && !!media});
  timer.remain = timer.total; timer.laps = [];
  enAudio.pause(); try { enAudio.currentTime = 0; } catch {}
}
function clock(ms, up=false){
  const t = up ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
const clockTime = d => d.toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit'});
function timerStart(){
  if (!timer.subj) return;
  if (timer.done || timer.remain <= 0) setTimerSubj(timer.subj);
  stopPreview(); ensureSound();
  timer.endAt = Date.now() + timer.remain; timer.running = true;
  if (timer.audio && media){
    const pos = (timer.total - timer.remain) / 1000;
    if (!media.duration || pos < media.duration){
      try { enAudio.currentTime = pos; } catch {}
      enAudio.play().catch(() => toast('음원을 재생하지 못했어요. 무음 모드와 볼륨을 확인해 주세요.'));
    }
  }
  syncWake();
}
function timerPause(){
  if (!timer.running) return;
  timer.remain = Math.max(0, timer.endAt - Date.now()); timer.running = false;
  enAudio.pause(); syncWake();
}
function timerFinish(){
  if (LAP_SUBJ.includes(timer.subj) && timer.laps.length){ const rest = timer.total - tLapSum(); if (rest >= 1000) timer.laps.push(rest); }
  timer.remain = 0; timer.running = false; timer.done = true;
  enAudio.pause(); syncWake(); beep(BEEP_END);
  const s = subjects().find(x => x.key === timer.subj);
  toast(`${s ? s.name + ' ' : ''}시험 시간이 끝났어요.`, true);
  if (state.tab === 'timer') render(); else markRun();
  renderFs();
}
function stopPreview(){ if (previewing){ previewing = false; enAudio.pause(); try { enAudio.currentTime = 0; } catch {} } }
function markRun(){ document.querySelectorAll('[data-tab="timer"]').forEach(b => b.classList.toggle('run', timer.running)); }

function renderTimer(){
  const subs = subjects();
  if (timer.subj && !subs.some(s => s.key === timer.subj)) timer.subj = null;
  const running = timer.running, s = subs.find(x => x.key === timer.subj);
  let h = `<section class="card"><h2>과목</h2><div class="tgrid">${subs.map(x => `<button class="tsub ${timer.subj === x.key ? 'on' : ''}" data-act="tm-subj" data-s="${x.key}" ${running ? 'disabled' : ''}>
    <b>${esc(x.name)}</b><span>${timerMinutes(x.key)}분${x.key === 'en' && media ? ', 듣기 포함' : ''}</span></button>`).join('')}</div></section>`;
  if (!s) return h + `<section class="card"><p class="sub" style="margin:0">과목을 고르면 시험 시간에 맞춰 타이머가 준비돼요.</p></section>`;
  const R = 54, C = 2 * Math.PI * R, frac = timer.total ? timer.remain / timer.total : 0;
  const main = running ? '일시정지' : timer.done ? '다시 시작' : timer.remain < timer.total ? '계속' : '시작';
  h += `<section class="card tcard"><div class="ring ${timer.remain <= 300000 && timerStarted() ? 'low' : ''}" id="tm-ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="${R}"/><circle class="bar2" id="tm-bar" cx="60" cy="60" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>
      <div class="mid"><div id="tm-time" role="timer" aria-live="off">${clock(timer.remain)}</div><div id="tm-sub">${esc(s.name)} ${timerMinutes(s.key)}분</div></div></div>
    ${LAP_SUBJ.includes(s.key)
      ? `<div class="tbtns" style="grid-template-columns:1.6fr 1fr 1fr;max-width:420px"><button class="btn" data-act="tm-main">${main}</button><button class="btn ghost" data-act="tm-lap" ${running ? '' : 'disabled'}>랩</button><button class="btn ghost" data-act="tm-reset" ${timerStarted() ? '' : 'disabled'}>초기화</button></div>
         <div class="fs-lap" id="tm-lap" style="font-size:15px"></div>`
      : `<div class="tbtns"><button class="btn" data-act="tm-main">${main}</button><button class="btn ghost" data-act="tm-reset" ${timerStarted() ? '' : 'disabled'}>초기화</button></div>`}
    <button class="btn ghost" data-act="tm-fs" style="max-width:360px;margin-top:8px">전체화면으로 보기</button>
    ${LAP_SUBJ.includes(s.key) ? `<div id="tm-laps" style="width:100%;display:flex;justify-content:center">${lapTableHtml()}</div>` : ''}
    <div id="tm-msg" role="status">${timer.done ? '시험 종료' : running ? `종료 예정 ${clockTime(new Date(timer.endAt))}` : ''}</div>
    <p class="hint" style="margin:6px 0 0">종료 10분 전, 5분 전, 종료 때 알림음이 울려요. 타이머가 도는 동안 화면이 꺼지지 않아요. 다른 앱으로 나가 있어도 시간은 정확히 흐르지만, 알림음은 앱으로 돌아왔을 때 울려요.</p></section>`;
  if (s.key === 'en'){
    h += `<section class="card"><h2>영어 듣기 음원</h2>`;
    if (media){
      h += `<div class="row between" style="margin-bottom:10px"><div class="grow"><b style="word-break:break-all">${esc(media.name)}</b><div class="sub">${media.duration ? clock(media.duration * 1000, true) + ' 분량, ' : ''}시작을 누르면 함께 재생돼요.</div></div></div>
        <div class="grid3" style="margin:0"><button class="btn ghost" data-act="au-preview" ${running || timerStarted() ? 'disabled' : ''}>${previewing ? '정지' : '미리 듣기'}</button>
        <label class="btn ghost" style="text-align:center;${running ? 'opacity:.45;pointer-events:none' : ''}">교체<input id="auFile" type="file" accept="audio/*,.mp3,.m4a" hidden></label>
        <button class="btn danger" data-act="au-del" ${running ? 'disabled' : ''}>삭제</button></div>
        <p class="hint" style="margin:10px 0 0">미리 듣기로 볼륨을 맞춰 두세요. 음원은 이 기기에만 저장돼서 다른 기기에서는 따로 올려야 해요.</p>`;
    } else {
      h += `<p class="sub" style="margin:0 0 12px">음원을 올리면 시험 시간이 70분으로 바뀌고, 시작과 동시에 듣기가 재생돼요. 올리지 않으면 독해만 50분으로 연습해요.</p>
        <label class="btn" style="display:block;text-align:center">듣기 음원 올리기<input id="auFile" type="file" accept="audio/*,.mp3,.m4a" hidden></label>
        <p class="hint" style="margin:10px 0 0">음원은 이 기기에만 저장돼요.</p>`;
    }
    h += `</section>`;
  }
  return h;
}
function tickTimer(){
  if (!timer.running) return;
  timer.remain = Math.max(0, timer.endAt - Date.now());
  const min = timer.total / 60000;
  if (!timer.warned.w10 && min > 10 && timer.remain <= 600000 && timer.remain > 0){
    timer.warned.w10 = true; if (timer.remain > 300000){ beep(BEEP_WARN); toast('종료 10분 전이에요.'); } }
  if (!timer.warned.w5 && min > 5 && timer.remain <= 300000 && timer.remain > 0){ timer.warned.w5 = true; timer.warned.w10 = true; beep(BEEP_WARN); toast('종료 5분 전이에요.'); }
  if (timer.remain <= 0){ timerFinish(); return; }
  const lp = $('#tm-lap'); if (lp) lp.textContent = lapLine();
  const t = $('#tm-time'); if (!t) return;
  t.textContent = clock(timer.remain);
  const bar = $('#tm-bar'); if (bar){ const C = 2 * Math.PI * 54; bar.setAttribute('stroke-dashoffset', C * (1 - timer.remain / timer.total)); }
  $('#tm-ring')?.classList.toggle('low', timer.remain <= 300000);
}

// ═════════════════════════ 풀이 시간 측정 (하프·사설) ═════════════════════════
const sw = { examId:null, subj:null, startAt:0 };
try { Object.assign(sw, JSON.parse(localStorage.getItem('mocklog-sw')) || {}); } catch {}
const saveSw = () => { try { localStorage.setItem('mocklog-sw', JSON.stringify(sw)); } catch {} };
function swMs(e, k){
  const base = (e.scores?.[k]?.time || 0) * 1000;
  return sw.examId === e.id && sw.subj === k ? base + (Date.now() - sw.startAt) : base;
}
const lapsOf = (e, k) => e.scores?.[k]?.laps || [];
const lapSum = (e, k) => lapsOf(e, k).reduce((a, l) => a + l.ms, 0);
const nextLapNo = (e, k) => { const L = lapsOf(e, k); return L.length ? (Number(L[L.length - 1].no) || L.length) + 1 : 1; };
function lapNow(e, k){
  const ms = Math.max(0, swMs(e, k) - lapSum(e, k));
  e.scores ??= {}; const sc = (e.scores[k] ??= {}); sc.laps ??= [];
  sc.laps.push({no: nextLapNo(e, k), ms}); touch();
}
function swStop(){
  const e = data?.exams.find(x => x.id === sw.examId);
  if (e){ e.scores ??= {}; const sc = (e.scores[sw.subj] ??= {}); sc.time = Math.round(swMs(e, sw.subj) / 1000); }
  Object.assign(sw, {examId:null, subj:null, startAt:0}); saveSw();
}
const FS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
const defaultTarget = (e, k) => serOf(e)?.targets?.[k] ?? (isHalf(e) ? null : timerMinutes(k));
function ensureTarget(e, k){ e.scores ??= {}; const sc = (e.scores[k] ??= {}); if (!('target' in sc)) sc.target = defaultTarget(e, k); return sc; }
function setTarget(e, k, v){
  const sc = ensureTarget(e, k); sc.target = v;
  const sr = serOf(e); if (sr){ sr.targets ??= {}; sr.targets[k] = v; }
  if (sw.examId === e.id && sw.subj === k) sw.alerted = v != null && swMs(e, k) >= v * 60000;
  touch();
}
function swToggle(e, k){
  const same = sw.examId === e.id && sw.subj === k;
  if (sw.examId) swStop();
  let started = false;
  if (!same){
    ensureSound(); const sc = ensureTarget(e, k);
    Object.assign(sw, {examId:e.id, subj:k, startAt:Date.now()});
    sw.alerted = sc.target != null && swMs(e, k) >= sc.target * 60000;
    saveSw(); started = true;
  }
  touch(); syncWake();
  return started;
}
function lapsHtml(e, s){
  const L = lapsOf(e, s.key); if (!L.length) return '';
  const max = Math.max(...L.map(l => l.ms)), avg = L.reduce((a, l) => a + l.ms, 0) / L.length;
  const wrongNos = new Set((e.wrongs || []).filter(w => w.subj === s.key).map(w => String(w.no)));
  const maxL = L.find(l => l.ms === max);
  return `<div class="laps"><div class="lapsum"><span>문항 <b>${L.length}개</b></span><span>평균 <b>${clock(avg, true)}</b></span><span>가장 오래 <b>${esc(maxL.no)}번 ${clock(max, true)}</b></span></div>`
    + L.map((l, i) => `<div class="laprow ${l.ms === max ? 'max' : ''}">
      <button class="lno" data-act="lap-no" data-s="${s.key}" data-i="${i}" aria-label="${esc(l.no)}번, 번호 고치기">${esc(l.no)}번</button>
      <div><div class="bar" style="height:8px;border-radius:4px;width:${Math.max(4, l.ms / max * 100)}%"></div></div>
      <span class="lt">${clock(l.ms, true)}</span>
      <button class="lapw" data-act="lap-wrong" data-s="${s.key}" data-i="${i}" ${wrongNos.has(String(l.no)) ? 'disabled' : ''}>${wrongNos.has(String(l.no)) ? '오답 등록됨' : '오답 등록'}</button>
      <button class="x" data-act="lap-del" data-s="${s.key}" data-i="${i}" aria-label="${esc(l.no)}번 기록 삭제">×</button></div>`).join('') + `</div>`;
}
function swCard(e, subs){
  let h = `<section class="card"><h2>풀이 시간</h2><p class="hint">시작을 누르면 전체화면으로 바뀌어요. 한 문항을 끝낼 때마다 "N번 완료"를 누르면 문항별 시간이 기록돼요.</p>`;
  h += subs.map(s => {
    const on = sw.examId === e.id && sw.subj === s.key, ms = swMs(e, s.key), has = ms > 0;
    const sc = e.scores?.[s.key] || {}, tg = 'target' in sc ? sc.target : defaultTarget(e, s.key);
    return `<div class="swrow ${on ? 'running' : ''}"><div><b>${esc(s.name)}</b><div class="sub">${tg ? `목표 ${tg}분` : '목표 없음'}</div></div>
      <span class="swclock" data-sw="${e.id}" data-s="${s.key}">${clock(ms, true)}</span>
      <button class="btn sm swbtn ${on ? '' : 'ghost'}" data-act="sw-toggle" data-s="${s.key}">${on ? '정지' : has ? '이어서' : '시작'}</button>
      <button class="x swfs" data-act="fs-open" data-s="${s.key}" aria-label="${esc(s.name)} 풀이 시간 전체화면">${FS_ICON}</button>
      <button class="x" data-act="sw-menu" data-s="${s.key}" aria-label="${esc(s.name)} 풀이 시간 직접 입력 또는 초기화">⋯</button></div>${lapsHtml(e, s)}`; }).join('');
  return h + `</section>`;
}
function tickSw(){
  if (!sw.examId) return;
  const e = data?.exams.find(x => x.id === sw.examId); if (!e){ swStop(); syncWake(); return; }
  const ms = swMs(e, sw.subj);
  document.querySelectorAll(`[data-sw="${e.id}"][data-s="${sw.subj}"]`).forEach(el => el.textContent = clock(ms, true));
  const tg = e.scores?.[sw.subj]?.target;
  if (tg && !sw.alerted && ms >= tg * 60000){ sw.alerted = true; beep(BEEP_END); toast('목표 시간이 지났어요.'); }
}

// ═════════════════════════ 전체화면 ═════════════════════════
function fsOpen(fs){ state.fs = fs; renderFs(); }
function fsClose(){ state.fs = null; renderFs(); render(); }
function renderFs(){
  let el = $('#fs');
  if (!state.fs){ el?.remove(); document.documentElement.classList.remove('fs-on'); return; }
  const html = state.fs.kind === 'timer' ? fsTimerHtml() : fsSwHtml();
  if (!html){ state.fs = null; return renderFs(); }
  if (!el){ el = document.createElement('div'); el.id = 'fs'; el.className = 'fs'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); document.body.appendChild(el); }
  document.documentElement.classList.add('fs-on');
  el.innerHTML = html; tickFs();
}
function fsTimerHtml(){
  const s = subjects().find(x => x.key === timer.subj); if (!s) return '';
  const main = timer.running ? '일시정지' : timer.done ? '다시 시작' : timer.remain < timer.total ? '계속' : '시작';
  return `<div class="fs-top"><div><div class="fs-t1">${esc(s.name)} 모의고사</div><div class="fs-t2">시험 시간 ${timerMinutes(s.key)}분</div></div>
      <button class="fs-close" data-act="fs-close">닫기</button></div>
    <div class="fs-mid"><div class="fs-label" id="fs-label"></div><div class="fs-time" id="fs-time" role="timer"></div><div class="fs-sub" id="fs-sub"></div><div class="fs-prog"><i id="fs-prog"></i></div><div class="fs-lap" id="fs-lap"></div></div>
    <div class="fs-bot">${LAP_SUBJ.includes(s.key) && timer.running
        ? `<div class="fs-btns"><button class="btn fs-main" data-act="fs-tlap">랩</button><button class="btn ghost fs-main" data-act="fs-tm">${main}</button></div>`
        : `<button class="btn fs-main" data-act="fs-tm">${main}</button>`}</div>`;
}
function fsSwHtml(){
  const e = data.exams.find(x => x.id === state.fs.examId), s = subjects().find(x => x.key === state.fs.subj);
  if (!e || !s) return '';
  const on = sw.examId === e.id && sw.subj === s.key, tg = e.scores?.[s.key]?.target ?? null;
  return `<div class="fs-top"><div><div class="fs-t1">${esc(examName(e))}</div><div class="fs-t2">${esc(s.name)} 풀이 시간</div></div>
      <button class="fs-close" data-act="fs-close" aria-label="전체화면 닫기${on ? ', 측정은 계속돼요' : ''}">닫기</button></div>
    <div class="fs-mid"><div class="fs-label" id="fs-label"></div><div class="fs-time" id="fs-time" role="timer"></div><div class="fs-sub" id="fs-sub"></div><div class="fs-prog" ${tg ? '' : 'hidden'}><i id="fs-prog"></i></div><div class="fs-lap" id="fs-lap"></div></div>
    <div class="fs-bot"><div class="fs-target"><span class="sub">목표 시간</span>
        <button class="ibtn" data-act="fs-tg" data-d="-1" aria-label="목표 1분 줄이기">−</button>
        <button class="fs-tgv" data-act="fs-tg-edit" aria-label="목표 시간 직접 입력">${tg ? tg + '분' : '없음'}</button>
        <button class="ibtn" data-act="fs-tg" data-d="1" aria-label="목표 1분 늘리기">+</button>
        ${tg ? `<button class="ibtn wide" data-act="fs-tg-clear">없애기</button>` : ''}</div>
      ${on ? `<div class="fs-btns"><button class="btn fs-main" data-act="fs-lap">${nextLapNo(e, s.key)}번 완료</button><button class="btn ghost fs-main" data-act="fs-sw">정지</button></div>`
           : `<button class="btn fs-main" data-act="fs-sw">${swMs(e, s.key) > 0 ? '이어서' : '시작'}</button>`}
      ${lapsOf(e, s.key).length ? `<button class="fs-undo" data-act="fs-lap-undo">마지막 문항 기록 되돌리기</button>` : ''}</div>`;
}
function tickFs(){
  if (!state.fs) return;
  const box = $('#fs'), T = $('#fs-time'), L = $('#fs-label'), S = $('#fs-sub'), P = $('#fs-prog');
  if (!box || !T) return;
  let time, label, sub = '', prog = 0, over = false, low = false;
  if (state.fs.kind === 'timer'){
    time = clock(timer.remain);
    label = timer.done ? '시험 종료' : timer.running ? '남은 시간' : timer.remain < timer.total ? '일시정지' : '시작 전';
    sub = timer.running ? `종료 예정 ${clockTime(new Date(timer.endAt))}` : '';
    prog = timer.total ? 1 - timer.remain / timer.total : 0;
    low = timer.remain <= 300000 && timerStarted();
    const LP = $('#fs-lap'); if (LP) LP.textContent = lapLine();
  } else {
    const e = data.exams.find(x => x.id === state.fs.examId); if (!e) return;
    const k = state.fs.subj, ms = swMs(e, k), tg = e.scores?.[k]?.target, on = sw.examId === e.id && sw.subj === k;
    if (tg){
      const left = tg * 60000 - ms;
      if (left >= 0){ time = clock(left); label = '남은 시간'; }
      else { time = '+' + clock(-left, true); label = '목표 시간 초과'; over = true; }
      sub = `경과 ${clock(ms, true)}, 목표 ${tg}분`; prog = Math.min(1, ms / (tg * 60000));

function quizStart(o, ids){

function quizDoneHtml(){
  const {o, q} = state.ov, ok = q.res.filter(r => r.ok).length, n = q.res.length, wrong = q.res.filter(r => !r.ok);
  return `<div class="sh-in"><div class="sh-top"><div><div class="fs-t1">퀴즈 결과</div><div class="fs-t2">${esc(colName(o.col))}</div></div><button class="fs-close" data-act="ov-close">닫기</button></div>

    ${wrong.length ? `<section class="card"><h2>틀린 문항</h2>${wrong.map(r => { const f = findWrong(r.id); if (!f) return ''; return `<div class="qrow"><span>${esc(subjName(f.w.subj))} ${esc(f.w.no)}번 <span class="sub">${esc(examName(f.e))}</span></span><b>정답 ${esc(ansText(f.w.ans))}</b></div>`; }).join('')}</section>` : ''}

      <button class="btn ghost" data-act="ov-close">끝내기</button></div></div>`;

function quizAnswer(pick){
  const q = state.ov.q, f = findWrong(q.ids[q.i]); if (!f || q.phase !== 'q') return;
  const ok = checkAns(f.w, pick);
  f.w.quiz = [...(f.w.quiz || []), {t:Date.now(), ok, pick:String(pick)}].slice(-20);
  q.res.push({id:f.w.id, ok, pick:String(pick)}); q.phase = 'fb'; touch(); renderOv();
}

// ═════════════════════════ 오답노트 PDF 출력 ═════════════════════════
function loadScript(src){ return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('불러오기 실패')); document.head.appendChild(sc); }); }
const loadImgUrl = url => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
function pdfPool(o){ return allWrongs().filter(({w}) => inCol(w, o.col) && (!o.subj || w.subj === o.subj) && (o.target !== 'un' || !isSolved(w))).reverse(); }
function pdfSetupHtml(o){
  const all = pdfPool(o), withImg = all.filter(({w}) => imgsOf(w).length);
  return `<div class="sh-in"><div class="sh-top"><div><div class="fs-t1">PDF로 출력</div><div class="fs-t2">${esc(colName(o.col))}</div></div><button class="fs-close" data-act="ov-close">닫기</button></div>
    <section class="card">
      <div class="setlabel">과목</div>${chipRow('ps', 'subj', subjOpts(o.col), o.subj)}
      <div class="setlabel">대상</div>${chipRow('ps', 'target', [['all','전부'],['un','미해결만']], o.target)}
      <div class="setlabel">메모</div>${chipRow('ps', 'memo', [['1','넣기'],['0','빼기']], o.memo)}
      <p class="sub" style="margin:14px 0 12px">사진이 있는 ${withImg.length}문항을 A4 2단으로 채워 넣고, 마지막 쪽에 정답표를 붙여요.${all.length - withImg.length ? ` 사진이 없는 ${all.length - withImg.length}문항은 빠져요.` : ''}</p>
      <button class="btn" data-act="pdf-go" ${withImg.length && !o.busy ? '' : 'disabled'}>${o.busy ? '만드는 중…' : 'PDF 만들기'}</button>
      <p class="hint" id="pdfMsg" style="margin:10px 0 0">${o.msg || ''}</p>
      ${o.blob ? `<div class="grid2" style="margin:8px 0 0"><button class="btn" data-act="pdf-share">공유·저장</button><button class="btn ghost" data-act="pdf-dl">다운로드</button></div>` : ''}</section></div>`;
}
function wrapLines(ctx, text, maxW){
  const out = []; let line = '';
  for (const ch of String(text)){ const t = line + ch; if (ctx.measureText(t).width > maxW && line){ out.push(line); line = ch; } else line = t; }
  if (line) out.push(line); return out;
}
async function makePdf(o){
  const setMsg = t => { o.msg = t; const m = $('#pdfMsg'); if (m) m.textContent = t; };
  o.busy = true; o.blob = null; renderOv();
  try {
    setMsg('준비 중…');
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const pool = pdfPool(o).filter(({w}) => imgsOf(w).length);
    const items = [];
    for (let i = 0; i < pool.length; i++){
      setMsg(`사진 불러오는 중 ${i + 1}/${pool.length}`);
      const ims = [];
      for (const im of imgsOf(pool[i].w)){ const u = await store.getImg(im.id); if (u) ims.push(await loadImgUrl(u)); }
      if (ims.length) items.push({...pool[i], ims});
    }
    if (!items.length){ setMsg('사진을 불러오지 못했어요.'); o.busy = false; renderOv(); return; }
    // A4 200dpi 기준 배치
    const PW = 1654, PH = 2339, M = 110, GUT = 56, COLW = (PW - 2 * M - GUT) / 2, TOP = M + 90, BOT = PH - M - 40;
    const FONT = getComputedStyle(document.body).fontFamily;
    const mctx = document.createElement('canvas').getContext('2d');
    const LABEL = 46, GAP = 40, IGAP = 14, MLINE = 32;
    let page = 0, col = 0, y = TOP; const place = [];
    items.forEach((it, idx) => {
      mctx.font = `24px ${FONT}`;
      const memo = o.memo === '1' && it.w.note ? wrapLines(mctx, '메모: ' + it.w.note, COLW) : [];
      const memoH = memo.length ? memo.length * MLINE + 10 : 0;
      let hs = it.ims.map(im => im.naturalHeight * COLW / im.naturalWidth);
      const fixed = LABEL + memoH + IGAP * (hs.length - 1), avail = BOT - TOP;
      let sum = hs.reduce((a, b) => a + b, 0);
      if (fixed + sum > avail){ const k = (avail - fixed) / sum; hs = hs.map(h => h * k); sum = avail - fixed; }
      const total = fixed + sum;
      if (y + total > BOT && y > TOP){ if (col === 0){ col = 1; y = TOP; } else { page++; col = 0; y = TOP; } }
      place.push({it, idx, page, col, y, hs, memo});
      y += total + GAP;
    });
    const itemPages = page + 1;
    // 정답표 배치
    const ROWH = 48, ansTop = TOP + 80, perCol = Math.floor((BOT - ansTop) / ROWH), perPage = perCol * 2;
    const ansPages = Math.ceil(items.length / perPage), total = itemPages + ansPages;
    const header = (ctx, p, title) => {
      ctx.fillStyle = '#111'; ctx.font = `bold 36px ${FONT}`; ctx.textBaseline = 'alphabetic';
      ctx.fillText(title, M, M + 40);
      ctx.font = `24px ${FONT}`; ctx.fillStyle = '#777'; const d = new Date(), ds = `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
      ctx.fillText(ds, PW - M - ctx.measureText(ds).width, M + 40);
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(M, M + 62); ctx.lineTo(PW - M, M + 62); ctx.stroke();
      ctx.font = `22px ${FONT}`; ctx.fillStyle = '#888'; const pn = `${p + 1} / ${total}`;
      ctx.fillText(pn, (PW - ctx.measureText(pn).width) / 2, PH - M + 30);
    };
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
    const title = `${colName(o.col)} 오답노트`;
    for (let p = 0; p < total; p++){
      setMsg(`쪽 만드는 중 ${p + 1}/${total}`);
      await new Promise(r => setTimeout(r, 0));
      const cv = document.createElement('canvas'); cv.width = PW; cv.height = PH;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH);
      if (p < itemPages){
        header(ctx, p, title);
        ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(M + COLW + GUT / 2, TOP - 10); ctx.lineTo(M + COLW + GUT / 2, BOT); ctx.stroke();
        for (const pl of place.filter(x => x.page === p)){
          const x = M + pl.col * (COLW + GUT); let yy = pl.y;
          ctx.fillStyle = '#111'; ctx.font = `bold 32px ${FONT}`; const num = `${pl.idx + 1}.`; ctx.fillText(num, x, yy + 32);
          const nw = ctx.measureText(num + ' ').width;
          ctx.font = `23px ${FONT}`; ctx.fillStyle = '#666';
          let src = `${subjName(pl.it.w.subj)} ${pl.it.w.no}번, ${srcName(pl.it.e, pl.it.w)}`;
          while (ctx.measureText(src).width > COLW - nw - 4 && src.length > 4) src = src.slice(0, -2) + '…';
          ctx.fillText(src, x + nw, yy + 31);
          yy += LABEL;
          pl.it.ims.forEach((im, j) => {
            const h = pl.hs[j], w2 = Math.min(COLW, im.naturalWidth * h / im.naturalHeight);
            ctx.drawImage(im, x, yy, w2, h); yy += h + IGAP;
          });
          yy -= IGAP;
          if (pl.memo.length){ ctx.font = `24px ${FONT}`; ctx.fillStyle = '#444'; yy += 10; pl.memo.forEach(l => { yy += MLINE; ctx.fillText(l, x, yy - 6); }); }
        }
      } else {
        const ap = p - itemPages; header(ctx, p, `${title} 정답`);
        ctx.font = `bold 30px ${FONT}`; ctx.fillStyle = '#111'; ctx.fillText('정답표', M, TOP + 30);
        const slice = items.slice(ap * perPage, (ap + 1) * perPage);
        slice.forEach((it, k) => {
          const c = Math.floor(k / perCol), r = k % perCol, x = M + c * (COLW + GUT), yy = ansTop + r * ROWH;
          const n = ap * perPage + k + 1;
          ctx.fillStyle = r % 2 ? '#fff' : '#f3f3f3'; ctx.fillRect(x, yy, COLW, ROWH);
          ctx.fillStyle = '#111'; ctx.font = `bold 26px ${FONT}`; ctx.fillText(`${n}.`, x + 12, yy + 33);
          ctx.font = `bold 28px ${FONT}`; ctx.fillText(ansText(it.w.ans) || '-', x + 90, yy + 34);
          ctx.font = `21px ${FONT}`; ctx.fillStyle = '#666';
          let src = `${subjName(it.w.subj)} ${it.w.no}번, ${srcName(it.e, it.w)}`;
          while (ctx.measureText(src).width > COLW - 200 && src.length > 4) src = src.slice(0, -2) + '…';
          ctx.fillText(src, x + 180, yy + 32);
        });
      }
      if (p) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297);
      cv.width = cv.height = 0;
    }
    o.blob = pdf.output('blob');
    o.fname = `${colName(o.col)}_오답노트.pdf`.replace(/[\\/:*?"<>|]/g, '_');
    o.msg = `${total}쪽짜리 PDF를 만들었어요. (문항 ${items.length}개, 정답표 ${ansPages}쪽)`;
  } catch (err) {
    console.error(err);
    o.msg = navigator.onLine ? 'PDF를 만들지 못했어요. 다시 시도해 주세요.' : '처음 한 번은 인터넷 연결이 필요해요.';
  }
  o.busy = false; renderOv();
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ── 공통 오버레이 (퀴즈·출력) ──
function renderOv(){
  let el = $('#ov');
  if (!state.ov){ el?.remove(); document.documentElement.classList.toggle('fs-on', !!(state.fs || state.wn)); return; }
  if (!el){ el = document.createElement('div'); el.id = 'ov'; el.className = 'sheet ovl'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); document.body.appendChild(el); }
  document.documentElement.classList.add('fs-on');
  const k = state.ov.kind;
  const keep = el.scrollTop;
  el.innerHTML = k === 'quizSetup' ? quizSetupHtml(state.ov.o) : k === 'quiz' ? quizHtml() : k === 'nf' ? nfHtml() : pdfSetupHtml(state.ov.o);
  if (k !== 'quiz') el.scrollTop = keep;
  hydrateImgs(el);
  if (k === 'quiz' && state.ov.q.phase !== 'q') el.scrollTo(0, el.scrollHeight);
  else if (k === 'quiz') { el.scrollTo(0, 0); $('#q-short')?.focus(); }
}
function closeOv(){ state.ov = null; renderOv(); render(); }

function newCollection(){

  const listTop = $('.elist')?.scrollTop || 0;
